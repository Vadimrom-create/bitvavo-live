services:
  - type: web
    name: bitvavo-live-probe
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    buildCommand: python -m py_compile oracle/bitvavo_public_probe.py
    startCommand: python oracle/bitvavo_public_probe.py
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 10
