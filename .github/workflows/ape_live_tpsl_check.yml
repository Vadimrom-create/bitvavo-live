name: APE live TP SL check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ape_live_tpsl_check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent APE live check
        run: |
          python - <<'PY'
          import json,time
          from research.http import PublicClient
          from research.common import finite
          from research.features import describe
          from research.risk import structural_plan

          market="APE-EUR"
          c=PublicClient(timeout=12,retries=2,requests_per_second=6)
          now=time.time()
          metas={m["market"]:m for m in c.get("/markets")}
          ticker=next(x for x in c.get("/ticker/24h") if x.get("market")==market)
          book=c.get("/"+market+"/book",{"depth":25},cache=False)

          def closed(interval,limit,dur_ms):
              raw=c.get("/"+market+"/candles",{"interval":interval,"limit":limit},cache=False)
              obs={}
              for r in raw:
                  if not isinstance(r,list) or len(r)<6: continue
                  vals=[finite(x) for x in r[:6]]
                  if any(v is None for v in vals): continue
                  t,o,h,l,cl,v=vals;t=int(t)
                  if t+dur_ms>now*1000: continue
                  obs[t]={"t":t,"o":o,"h":h,"l":l,"c":cl,"v":v,"bar_status":"CLOSED_TRADE"}
              if not obs:return []
              ks=sorted(obs);out=[];prev=None;x=ks[0]
              while x<=ks[-1]:
                  row=obs.get(x)
                  if row is not None:
                      prev=row["c"];out.append(row)
                  elif prev is not None:
                      out.append({"t":x,"o":prev,"h":prev,"l":prev,"c":prev,"v":0.0,"bar_status":"NO_TRADE"})
                  x+=dur_ms
              return out

          c5=closed("5m",120,300000); c15=closed("15m",120,900000)
          f5=describe(c5[-100:],"5m"); f15=describe(c15[-100:],"15m")

          bid=float(book["bids"][0][0]); ask=float(book["asks"][0][0])
          def depth(side,n=10): return sum(float(p)*float(q) for p,q in side[:n])
          bd=depth(book.get("bids",[])); ad=depth(book.get("asks",[]))
          plan=structural_plan({"market":market,"ask":ask},f15,metas[market])

          last=float(ticker["last"]); op=float(ticker["open"])
          print("APE_LIVE="+json.dumps({
            "last":last,"open":op,"high":float(ticker["high"]),"low":float(ticker["low"]),
            "change24_pct":(last/op-1)*100,
            "bid":bid,"ask":ask,"spread_pct":(ask/bid-1)*100,
            "bid_depth_top10_eur":bd,"ask_depth_top10_eur":ad,
            "book_imbalance_top10":(bd-ad)/(bd+ad) if bd+ad else None,
            "recent1h_high":max(x["h"] for x in c5[-12:]),"recent1h_low":min(x["l"] for x in c5[-12:]),
            "recent2h_high":max(x["h"] for x in c15[-8:]),"recent2h_low":min(x["l"] for x in c15[-8:]),
            "f5":f5,"f15":f15,"plan_now":plan
          },separators=(",",":")))
          PY
