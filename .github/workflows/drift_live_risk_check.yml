name: DRIFT live risk check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drift_live_risk_check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check DRIFT live structure
        run: |
          python - <<'PY'
          import json,time
          from research.http import PublicClient
          from research.features import describe
          from research.risk import structural_plan
          from research.common import finite

          c=PublicClient(timeout=12,retries=2,requests_per_second=6)
          c.get("/time",cache=False)
          markets={m["market"]:m for m in c.get("/markets")}
          ticker=next(x for x in c.get("/ticker/24h") if x.get("market")=="DRIFT-EUR")
          book=c.get("/DRIFT-EUR/book",{"depth":20},cache=False)
          candles=c.get("/DRIFT-EUR/candles",{"interval":"15m","limit":120},cache=False)
          now=time.time()
          rows=[]
          for r in candles:
              if not isinstance(r,list) or len(r)<6: continue
              t,o,h,l,cl,v=[finite(x) for x in r[:6]]
              if None in (t,o,h,l,cl,v): continue
              if t+900000>now*1000: continue
              rows.append({"t":int(t),"o":o,"h":h,"l":l,"c":cl,"v":v,"bar_status":"CLOSED_TRADE"})
          rows=sorted(rows,key=lambda x:x["t"])[-100:]
          f15=describe(rows,"15m")
          bid=float(book["bids"][0][0]); ask=float(book["asks"][0][0])
          spread=(ask/bid-1)*100
          plan=structural_plan({"market":"DRIFT-EUR","ask":ask},f15,markets["DRIFT-EUR"])
          out={
            "ts":now,
            "ticker":ticker,
            "bid":bid,"ask":ask,"spread_pct":spread,
            "features15":f15,
            "plan":plan
          }
          print("DRIFT_LIVE="+json.dumps(out,separators=(",",":")))
          PY
