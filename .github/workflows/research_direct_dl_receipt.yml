name: Research DIRECT / DL source receipt (read only)

# IMPORTANT: workflow_run activation requires this workflow to be merged to main.
# The draft PR does NOT activate hourly observation or change production.
on:
  workflow_run:
    workflows:
      - 'Solaire direct Bitvavo scan heartbeat'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-direct-dl-receipt-readonly
  cancel-in-progress: false

jobs:
  immutable-input-receipt:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read current public DIRECT snapshot only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/capture_direct_dl_prospective_receipt.py
            production_scan_status.json
            production_alert_candidates.json
            production_universe_snapshot.json
            decision_layer.json
          sparse-checkout-cone-mode: false

      - name: Prepare Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture fully hash-linked DIRECT features and explicit V4/DL unknowns
        run: |
          set -euo pipefail
          python scripts/capture_direct_dl_prospective_receipt.py \
            --revision "$(git rev-parse HEAD)" \
            --output /tmp/direct-dl-prospective-input-receipt.json.gz

      - name: Keep immutable research receipt for 3 days, never commit to main
        uses: actions/upload-artifact@v4
        with:
          name: direct-dl-input-receipt-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: /tmp/direct-dl-prospective-input-receipt.json.gz
          if-no-files-found: error
          retention-days: 3
