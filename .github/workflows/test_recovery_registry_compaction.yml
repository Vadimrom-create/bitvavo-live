name: Test Solaire recovery-registry compaction
on:
  pull_request:
    paths:
      - 'research/recovery_registry.py'
      - 'scripts/update_recovery_registry_heartbeat.py'
      - 'scripts/archive_recovery_registry.py'
      - 'tests/test_recovery_registry.py'
      - 'tests/test_recovery_registry_compaction.py'
      - '.github/workflows/production_scan_fast.yml'
      - '.github/workflows/test_recovery_registry_compaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-compaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install pytest
      - name: Compile edited Python modules
        run: |
          python -m py_compile research/recovery_registry.py scripts/update_recovery_registry_heartbeat.py scripts/archive_recovery_registry.py
      - name: Run adversarial recovery registry tests
        run: python -m pytest -q tests/test_recovery_registry.py tests/test_recovery_registry_compaction.py
      - name: Dry-run compaction on the real committed historical registry
        run: |
          set -euo pipefail
          python scripts/archive_recovery_registry.py --dry-run
          git diff --exit-code -- production_recovery_registry_shadow.json
