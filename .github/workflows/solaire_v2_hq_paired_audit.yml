name: Solaire HQ BUILDING paired audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/solaire_v2_hq_paired_trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare HQ BUILDING and CONFIRMED on same episodes
        run: python scripts/audit_solaire_v2_hq_vs_confirmed.py
      - name: Persist paired audit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research/solaire_v2_hq_building_vs_confirmed_20260921.json
          git diff --cached --quiet || git commit -m "Record HQ BUILDING paired audit"
          if git diff HEAD^ --quiet; then exit 0; fi
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
