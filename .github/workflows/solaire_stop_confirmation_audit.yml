name: Solaire stop-confirmation audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/stop_confirmation_audit_trigger.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit wick versus confirmed stop exits
        run: python scripts/audit_stop_confirmation.py

      - name: Persist audit
        run: |
          cp research/stop_confirmation_audit_20261006.json /tmp/result.json
          cp research/stop_confirmation_audit_20261006.md /tmp/result.md
          git config user.name github-actions
          git config user.email github-actions@github.com
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/result.json research/stop_confirmation_audit_20261006.json
            cp /tmp/result.md research/stop_confirmation_audit_20261006.md
            git add research/stop_confirmation_audit_20261006.json research/stop_confirmation_audit_20261006.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record stop-confirmation audit"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
