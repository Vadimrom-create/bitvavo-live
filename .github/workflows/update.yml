name: Update Bitvavo live data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Bitvavo public data
        run: python collector.py

      - name: Publish latest JSON
        run: |
          git config user.name "bitvavo-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bitvavo_live.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Bitvavo live data"
          git push
