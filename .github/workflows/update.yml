name: Public prospection and isolated shadow decisions
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths: ['*.py', 'research/**', 'scripts/**', 'tests/**', 'v4_config.json', '.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bitvavo-prospection-single-writer
  cancel-in-progress: false
env:
  PYTHONHASHSEED: '0'
  DRY_RUN: 'true'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scan-code
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: scan-code
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: scan-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitoring.txt
      - name: Validate acquisition and frozen scoring
        run: python scripts/run_tests.py data
      - name: Load current public state into fixed code
        id: state
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          python scripts/load_public_state.py --source ../scan-data --owner prospection
      - name: Publish fresh public quotes independently
        id: quotes
        continue-on-error: true
        timeout-minutes: 1
        run: |
          python scripts/live_quotes.py
          python scripts/publish_data.py --quotes
      - name: Open versioned technical pilot before acquisition
        id: pilot
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/run_prospective.py start
      - name: Collect corrected inputs and record the explicit scan
        id: scan
        run: |
          if python pipeline.py --data-policy CORRECTED_INPUTS_V1; then
            true
          else
            scan_exit=$?
            test "$scan_exit" -eq 2
          fi
          test -f runtime/current_scan.json
      - name: Run DL-V1 on this scan
        id: v1
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          from research.common import read_json
          from scripts.run_shadow import run
          c=read_json('runtime/current_scan.json')
          run(c['journal'],c['scan_id'],'v1')
          PY
      - name: Run Opportunity-only DL-V2 in shadow
        id: v2
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          from research.common import read_json
          from scripts.run_shadow import run
          c=read_json('runtime/current_scan.json')
          run(c['journal'],c['scan_id'],'v2')
          PY
      - name: Record comparison without future outcomes
        id: comparison
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          from research.common import read_json
          from scripts.run_comparison import run
          c=read_json('runtime/current_scan.json')
          run(c['journal'],c['scan_id'])
          PY
      - name: Exact replay and coherent manifest
        id: replay
        run: python scripts/prepare_publication.py
      - name: Publish owned scan outputs and confirmation receipt
        id: publication
        run: python scripts/publish_data.py
      - name: Publish optional same-scan candidate diagnostics
        id: feedback
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python scripts/load_public_state.py --source ../scan-data --owner feedback
          python scripts/run_feedback.py
          python scripts/publish_data.py --feedback
      - name: Preserve technical pilot enrollment independently
        id: pilot_record
        if: always() && steps.pilot.outcome == 'success' && steps.scan.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python scripts/run_prospective.py record
          python scripts/publish_data.py --pilot
      - name: Record every attempted cycle
        if: always() && steps.state.outcome == 'success'
        env:
          OUTCOME_SCAN: ${{ steps.scan.outcome }}
          OUTCOME_V1: ${{ steps.v1.outcome }}
          OUTCOME_V2: ${{ steps.v2.outcome }}
          OUTCOME_COMPARISON: ${{ steps.comparison.outcome }}
          OUTCOME_REPLAY: ${{ steps.replay.outcome }}
          OUTCOME_PUBLICATION: ${{ steps.publication.outcome }}
          OUTCOME_PILOT: ${{ steps.pilot.outcome }}
          OUTCOME_PILOT_RECORD: ${{ steps.pilot_record.outcome }}
        run: |
          python scripts/record_scan_attempt.py
          python scripts/publish_data.py --attempt
      - name: Preserve raw diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-replay-${{ github.run_id }}
          retention-days: 90
          path: |
            scan-code/runtime/replay-*.json.gz
            scan-code/pipeline_health.json
            scan-code/scan_manifest.json
            scan-code/shadow_status.json
            scan-code/scan_attempts/
            scan-code/prospective_sessions/
            scan-code/prospective_observations/
      - name: Prepare coherent public feed
        if: success() && steps.publication.outcome == 'success'
        env:
          OUTCOME_QUOTES: ${{ steps.quotes.outcome }}
          OUTCOME_FEEDBACK: ${{ steps.feedback.outcome }}
        run: python scripts/prepare_site.py
      - uses: actions/configure-pages@v5
        if: success() && steps.publication.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: success() && steps.publication.outcome == 'success'
        with:
          path: scan-code/_site
      - uses: actions/deploy-pages@v4
        if: success() && steps.publication.outcome == 'success'
