name: Bitvavo live data + frozen V4 + measurement + useful alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'research/**'
      - 'monitoring/**'
      - 'requirements-monitoring.txt'
      - 'scripts/**'
      - 'tests/**'
      - 'v4_config.json'
      - 'decision_watchlist.json'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bitvavo-live
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  DRY_RUN: 'true'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitoring.txt
      - name: Fetch validated Bitvavo execution quotes
        run: python scripts/live_quotes.py
      - name: Publish fresh quote immediately
        continue-on-error: true
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live_quotes.json ethfi_live.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record validated Bitvavo live quotes'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent quote state conflict; continue scan with fresh local quotes.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 6 ]; then
              sleep $((attempt * 2))
            fi
          done
          echo 'Quote publication retries exhausted; continue scan with fresh local quotes.' >&2
          exit 1
      - name: Critical tests and unchanged V4 scoring
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Collect, scan, record all markets and evaluate
        run: python pipeline.py
      - name: Verify exact V4 replay against frozen source
        id: replay
        run: python -m research.replay runtime/replay-*.json.gz
      - name: Run Decision Layer measurement
        id: decision_layer
        run: python scripts/run_decision_layer.py
      - name: Preserve raw replay inputs and failure diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scan-replay-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            runtime/replay-*.json.gz
            pipeline_health.json
            v5_report.json
            decision_layer.json
            live_quotes.json
            ethfi_live.json
      - name: Publish complete data and history before notifying
        id: publication
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          python scripts/publish_data.py
      - name: Prepare isolated position supervision even if prospecting failed
        if: always() && steps.tests.outcome == 'success'
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git worktree add --detach /tmp/bitvavo-monitor HEAD
      - name: Monitor every held position and send only justified actions
        id: positions
        continue-on-error: true
        if: always() && steps.tests.outcome == 'success'
        working-directory: /tmp/bitvavo-monitor
        env:
          ALLOW_BUY_ALERTS: 'false'
          BITVAVO_READ_API_KEY: ${{ secrets.BITVAVO_READ_API_KEY }}
          BITVAVO_READ_API_SECRET: ${{ secrets.BITVAVO_READ_API_SECRET }}
          POSITION_STATE_KEY: ${{ secrets.POSITION_STATE_KEY }}
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: bellonirom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_useful_alert.py
      - name: Upload private wallet summary
        if: always() && steps.tests.outcome == 'success' && steps.positions.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: private-wallet-summary-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: /tmp/bitvavo-monitor/wallet_private_summary.json

      - name: Persist encrypted anti-spam state and monitoring availability
        if: always() && steps.tests.outcome == 'success'
        working-directory: /tmp/bitvavo-monitor
        run: python scripts/publish_data.py --alerts
      - name: Prepare public feed
        run: |
          mkdir -p _site
          cp scan_feed.txt bitvavo_live.json live_quotes.json ethfi_live.json early_watch.txt early_watch.json _site/
          cp v4_watch.txt v4_watch.json v4_watch_raw.txt v4_watch_raw.json _site/
          cp market_control.txt market_control.json execution_snapshot.json _site/
          cp v5_report.json v5_report.md pipeline_health.json trend_cache_guard.json decision_funnel.json data_quality_audit.json data_quality_audit.md adaptive_enrichment.json evaluation.json proposed_orders.json _site/
          cp decision_layer.json decision_layer.md _site/
          cp candidate_memory.json _site/
          cp /tmp/bitvavo-monitor/position_monitor_status.json _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="fr"><meta charset="utf-8"><title>Bitvavo — suivi V4 / V5</title>
          <h1>Bitvavo — V4 mesurée, infrastructure V5</h1>
          <p><a href="ethfi_live.json">ETHFI-EUR — cotation Bitvavo validée</a></p>
          <p><a href="live_quotes.json">Cotations Bitvavo validées (last / bid / ask)</a></p>
          <p><a href="v5_report.md">Dernier scan et contrôle des hausses</a></p>
          <p><a href="decision_layer.md">Decision Layer V1 — lecture shadow</a></p>
          <p><a href="candidate_memory.json">Watchlist persistante 24–72 h</a></p>
          <p><a href="pipeline_health.json">État et fraîcheur des données</a></p>\n          <p><a href="data_quality_audit.md">Audit des rejets de données</a></p>\n          <p><a href="trend_cache_guard.json">Fraîcheur profils de tendance</a></p>\n          <p><a href="decision_funnel.json">Entonnoir de décision</a></p>\n          <p><a href="adaptive_enrichment.json">Audit enrichissement adaptatif</a></p>
          <p><a href="position_monitor_status.json">Disponibilité du suivi des positions</a></p>
          <p><a href="evaluation.json">Mesures chronologiques</a></p>
          <p><a href="v4_watch.txt">Décisions V4</a> · <a href="v4_watch_raw.json">V4 avant stabilisation</a></p>
          <p><a href="market_control.txt">Tous les marchés</a> · <a href="execution_snapshot.json">Carnets publics</a></p>
          <p><a href="proposed_orders.json">Propositions théoriques — validation humaine requise</a></p>
          </html>
          EOF
      - name: Configure legacy public Pages feed
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload legacy public Pages feed
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy legacy public Pages feed
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
