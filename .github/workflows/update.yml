name: Update Bitvavo live data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bitvavo-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Bitvavo public data
        run: python collector.py

      - name: Save latest data in repository
        run: |
          git config user.name "bitvavo-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bitvavo_live.json scan_feed.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update Bitvavo live data"
            git push
          fi

      - name: Prepare public scan feed
        run: |
          mkdir -p _site
          cp scan_feed.txt _site/scan_feed.txt
          cp bitvavo_live.json _site/bitvavo_live.json
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
          <head><meta charset="utf-8"><title>Bitvavo Live Feed</title></head>
          <body>
            <h1>Bitvavo Live Feed</h1>
            <p><a href="scan_feed.txt">scan_feed.txt</a></p>
            <p><a href="bitvavo_live.json">bitvavo_live.json</a></p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
