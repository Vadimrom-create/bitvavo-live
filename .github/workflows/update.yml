name: Bitvavo live data + V3 email alerts

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Envoyer un e-mail de test (aucun faux signal d'achat)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bitvavo-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Bitvavo public data
        run: python collector-2.py

      - name: Build ignition detector V3
        run: python early_detector.py

      - name: Send useful email alert
        env:
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email && '1' || '0' }}
        run: python email_alert_strict.py

      - name: Save latest data in repository
        run: |
          git config user.name "bitvavo-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bitvavo_live.json scan_feed.txt early_watch.txt early_watch.json scan_history.json signal_log.json
          if [ -f alert_state.json ]; then
            git add alert_state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Bitvavo live data + ignition V3"
            git push
          fi

      - name: Prepare public scan feed
        run: |
          mkdir -p _site
          cp scan_feed.txt _site/scan_feed.txt
          cp bitvavo_live.json _site/bitvavo_live.json
          cp early_watch.txt _site/early_watch.txt
          cp early_watch.json _site/early_watch.json
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
          <head><meta charset="utf-8"><title>Bitvavo Live Feed V3</title></head>
          <body>
            <h1>Bitvavo Live Feed V3</h1>
            <p><a href="scan_feed.txt">scan_feed.txt</a></p>
            <p><a href="early_watch.txt">early_watch.txt</a></p>
            <p><a href="early_watch.json">early_watch.json</a></p>
            <p><a href="bitvavo_live.json">bitvavo_live.json</a></p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
