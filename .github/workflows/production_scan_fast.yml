name: Solaire direct Bitvavo scan heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production_scan.py'
      - 'scripts/send_production_buy_alert.py'
      - 'scripts/send_catalyst_prewatch_alert.py'
      - 'research/production_gate.py'
      - 'research/production_acceleration.py'
      - 'research/production_alerts.py'
      - 'research/production_context.py'
      - 'research/production_news.py'
      - 'research/recovery_registry.py'
      - 'scripts/update_recovery_registry_heartbeat.py'
      - 'scripts/follow_active_candidates.py'
      - '.github/workflows/production_scan_fast.yml'
  # Cold-start fallback only. Normal cadence is self-chained through
  # workflow_dispatch, so a missed GitHub schedule event cannot stop scanning.
  schedule:
    - cron: '4 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: bitvavo-production-heartbeat-v1
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'

jobs:
  scan-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 66
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run twelve five-minute production cycles
        env:
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: bellonirom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          FOLLOW_NOTIFY_ENABLED: 'true'
        run: |
          set -euo pipefail

          for cycle in $(seq 1 12); do
            cycle_started="$(date +%s)"
            echo "=== heartbeat cycle ${cycle}/12 ==="

            if [ "${cycle}" -gt 1 ]; then
              git fetch origin main
              git rebase origin/main
            fi

            python scripts/production_scan.py
            python scripts/send_catalyst_prewatch_alert.py
            python scripts/send_production_buy_alert.py
            python scripts/update_recovery_registry_heartbeat.py
            # Never allow optional follower failure to block the production scan.
            if ! python scripts/follow_active_candidates.py; then
              echo 'CANDIDATE_FOLLOW_DEGRADED: will retry at next probe' >&2
            fi

            git config user.name 'bitvavo-live-bot'
            git config user.email 'actions@users.noreply.github.com'
            for file in \
              production_alert_candidates.json \
              production_scan_status.json \
              production_universe_snapshot.json \
              production_news_context.json \
              production_official_news_state.json \
              production_alert_state.json \
              production_alert_status.json \
              production_catalyst_alert_state.json \
              production_catalyst_alert_status.json \
              production_direct_decision_journal.json \
              production_recovery_registry_shadow.json \
              production_recovery_registry_status.json \
              production_candidate_follow_state.json \
              production_candidate_follow_status.json \
              production_candidate_follow_journal.json; do
              if [ -e "${file}" ]; then git add "${file}"; fi
            done

            if [ -d execution_observations ]; then git add execution_observations; fi

            if ! git diff --cached --quiet; then
              git commit -m "Record heartbeat production scan cycle ${cycle}"
              pushed=false
              for attempt in 1 2 3 4 5 6; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Heartbeat publication conflict; refusing to publish stale state." >&2
                  exit 1
                fi
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
                sleep $((attempt * 2))
              done
              if [ "${pushed}" != "true" ]; then
                echo "Heartbeat publication retries exhausted." >&2
                exit 1
              fi
            fi

            if [ "${cycle}" -lt 12 ]; then
              elapsed=$(( $(date +%s) - cycle_started ))
              sleep_for=$(( 300 - elapsed ))
              if [ "${sleep_for}" -gt 0 ]; then
                echo "Following priority candidates during the five-minute scan gap."
                next_scan_at=$((cycle_started + 300))
                while [ "$(date +%s)" -lt "$next_scan_at" ]; do
                  remaining=$((next_scan_at - $(date +%s)))
                  if [ "$remaining" -le 0 ]; then break; fi
                  step="$remaining"
                  if [ "$step" -gt 60 ]; then step=60; fi
                  sleep "$step"
                  if [ "$(date +%s)" -ge "$next_scan_at" ]; then break; fi
                  if ! python scripts/follow_active_candidates.py; then
                    echo 'CANDIDATE_FOLLOW_DEGRADED: minute probe failed' >&2
                  fi
                done
                # Persist the minute-probe snapshots before attempting the next rebase.
                for follow_file in production_candidate_follow_state.json production_candidate_follow_status.json production_candidate_follow_journal.json; do
                  if [ -e "$follow_file" ]; then git add "$follow_file"; fi
                done
                if ! git diff --cached --quiet; then
                  git commit -m "Record autonomous candidate follow-up observations"
                  follow_pushed=false
                  for attempt in 1 2 3 4 5 6; do
                    git fetch origin main
                    if ! git rebase origin/main; then
                      git rebase --abort || true
                      echo "Follow-up rebase conflict; refusing stale publication." >&2
                      exit 1
                    fi
                    if git push origin HEAD:main; then
                      follow_pushed=true
                      break
                    fi
                    sleep $((attempt * 2))
                  done
                  if [ "$follow_pushed" != "true" ]; then
                    echo "Follow-up publication retry limit exhausted." >&2
                    exit 1
                  fi
                fi
              else
                echo "Cycle exceeded five minutes; starting next cycle immediately."
              fi
            fi
          done

      - name: Hand off to next heartbeat run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active=0
          for status in queued in_progress; do
            count="$(
              gh api                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/production_scan_fast.yml/runs?status=${status}&per_page=50"                 --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length"
            )"
            active=$((active + count))
          done

          if [ "${active}" -gt 0 ]; then
            echo "Another heartbeat is already queued/in progress; no duplicate handoff."
            exit 0
          fi

          # A failed production step must not break the cadence chain. Avoid a
          # tight retry loop if a deterministic failure happens immediately.
          if [ "${{ job.status }}" != "success" ]; then
            echo "Heartbeat job ended with status ${{ job.status }}; delaying recovery handoff."
            sleep 60
          fi

          gh api             --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/workflows/production_scan_fast.yml/dispatches"             -f ref=main

          echo "Next heartbeat dispatched through workflow_dispatch."
