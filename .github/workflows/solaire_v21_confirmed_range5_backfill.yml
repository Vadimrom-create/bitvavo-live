name: Solaire confirmed range-5 backfill
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/solaire_v21_confirmed_range5_trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill confirmed range rejects against 5 percent
        run: python scripts/audit_solaire_v21_confirmed_range5.py
      - name: Persist backfill
        run: |
          cp research/solaire_v21_confirmed_range5_backfill_20260921.json /tmp/result.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/result.json research/solaire_v21_confirmed_range5_backfill_20260921.json
            git add research/solaire_v21_confirmed_range5_backfill_20260921.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record confirmed range-5 backfill"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
