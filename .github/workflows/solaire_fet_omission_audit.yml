name: Solaire FET omission audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solaire_fet_omission_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit FET and current Bitvavo gainers
        run: |
          python - <<'PY'
          import bisect,gzip,json,re,time
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path
          from research.common import finite,INTERVAL_MS
          from research.features import describe
          from research.http import PublicClient
          from research.production_acceleration import acceleration_signal
          from research.risk import structural_plan

          client=PublicClient(timeout=15,retries=3,requests_per_second=8)
          client.get("/time",cache=False)
          now=time.time()

          markets=[m for m in client.get("/markets") if m.get("quote")=="EUR" and m.get("status")=="trading"]
          meta={m["market"]:m for m in markets}
          tickers=client.get("/ticker/24h",cache=False)
          gains=[]
          for t in tickers:
              m=t.get("market")
              if m not in meta: continue
              last=finite(t.get("last")); op=finite(t.get("open")); qv=finite(t.get("volumeQuote"),0)
              if last and op:
                  gains.append({"market":m,"change24":(last/op-1)*100,"last":last,"qv":qv})
          gains.sort(key=lambda x:x["change24"],reverse=True)

          target="FET-EUR"
          t=next((x for x in gains if x["market"]==target),None)
          print("TOP30="+json.dumps(gains[:30],separators=(",",":")))
          print("FET_TICKER="+json.dumps(t,separators=(",",":")))

          r5=client.get("/"+target+"/candles",{"interval":"5m","limit":500},cache=False)
          r15=client.get("/"+target+"/candles",{"interval":"15m","limit":250},cache=False)

          def canonical(rows,interval):
              dur=INTERVAL_MS[interval];obs={}
              for r in rows:
                  if not isinstance(r,list) or len(r)<6:continue
                  vals=[finite(v) for v in r[:6]]
                  if any(v is None for v in vals):continue
                  ts,o,h,l,c,v=vals;ts=int(ts)
                  if ts+dur>now*1000 or ts%dur or min(o,h,l,c)<=0 or v<0:continue
                  obs[ts]={"t":ts,"o":o,"h":h,"l":l,"c":c,"v":v,"bar_status":"CLOSED_TRADE"}
              if not obs:return []
              ks=sorted(obs);out=[];prev=None;x=ks[0]
              while x<=ks[-1]:
                  row=obs.get(x)
                  if row is not None:
                      prev=row["c"];out.append(row)
                  elif prev is not None:
                      out.append({"t":x,"o":prev,"h":prev,"l":prev,"c":prev,"v":0.0,"bar_status":"NO_TRADE"})
                  x+=dur
              return out
          c5=canonical(r5,"5m");c15=canonical(r15,"15m")
          s5=[x["t"] for x in c5];s15=[x["t"] for x in c15]

          def feat(cs,starts,interval,ts):
              dur=INTERVAL_MS[interval]
              i=bisect.bisect_right(starts,int(ts*1000)-dur)
              if i<=0:return {"valid":False},None,i
              sub=cs[max(0,i-100):i]
              return describe(sub,interval),sub[-1]["c"],i

          spreads=[]
          rx=re.compile(r"(\d{8}T\d{6}Z)")
          def walk(o,fts):
              if isinstance(o,dict):
                  if o.get("market")==target:
                      sp=finite(o.get("spread_pct"));bid=finite(o.get("bid"));ask=finite(o.get("ask"))
                      if sp is None and bid and ask and bid>0 and ask>=bid:sp=(ask/bid-1)*100
                      if sp is not None:spreads.append((fts,sp,ask))
                  for v in o.values():walk(v,fts)
              elif isinstance(o,list):
                  for v in o:walk(v,fts)
          for folder in ["history/2026-09-20","history/2026-09-21"]:
              p=Path(folder)
              if not p.exists():continue
              for fp in p.glob("*.json.gz"):
                  mm=rx.search(fp.name)
                  if not mm:continue
                  fts=datetime.strptime(mm.group(1),"%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc).timestamp()
                  if fts<now-26*3600 or fts>now+60:continue
                  try:
                      with gzip.open(fp,"rt",encoding="utf-8") as h:walk(json.load(h),fts)
                  except Exception:pass
          spreads.sort();stimes=[x[0] for x in spreads]
          def prior_spread(ts):
              if not spreads:return None
              i=bisect.bisect_right(stimes,ts)-1
              if i<0:return None
              st,sp,ask=spreads[i]
              return {"age":ts-st,"spread":sp,"ask":ask} if ts-st<=1200 else None

          rows=[]
          for bar in c5:
              ts=bar["t"]/1000+301
              if ts<now-24*3600 or ts>now:continue
              f5,p,i5=feat(c5,s5,"5m",ts);f15,_,_=feat(c15,s15,"15m",ts)
              sig=acceleration_signal({"features":{"5m":f5,"15m":f15}})
              qv=sum(x["v"]*x["c"] for x in c5[max(0,i5-288):i5])
              sp=prior_spread(ts)
              plan=None
              if sp and sp.get("ask") and f15.get("valid"):
                  plan=structural_plan({"market":target,"ask":sp["ask"]},f15,meta[target])
              rows.append({
                  "ts":ts,"utc":datetime.fromtimestamp(ts,timezone.utc).isoformat(),
                  "price":p,"state":sig.get("state"),"score":sig.get("score"),
                  "evidence":sig.get("evidence_count"),"components":sig.get("components"),
                  "structural_range":f15.get("consolidation_range_pct"),
                  "stop_distance":plan.get("stop_distance_pct") if plan and plan.get("valid") else None,
                  "plan_valid":bool(plan and plan.get("valid")),
                  "plan_reason":None if not plan else plan.get("reason"),
                  "spread":None if not sp else sp["spread"],
                  "spread_age":None if not sp else sp["age"],
                  "rolling_qv":qv,
              })

          tracked=[x for x in rows if x["state"] in ("BUILDING_ACCELERATION","CONFIRMED_ACCELERATION")]
          confirmed=[x for x in rows if x["state"]=="CONFIRMED_ACCELERATION" and (x["score"] or 0)>=6.5 and (x["evidence"] or 0)>=3]
          maxrow=max(rows,key=lambda x:(x["score"] or -1)) if rows else None
          first_build=tracked[0] if tracked else None
          first_conf=confirmed[0] if confirmed else None

          current_price=t["last"] if t else (rows[-1]["price"] if rows else None)
          def pct(a,b):
              return (b/a-1)*100 if a and b else None

          executable=[]
          reasons=defaultdict(int)
          for x in confirmed:
              reason=None
              if x["rolling_qv"]<75000: reason="INSUFFICIENT_EXECUTION_LIQUIDITY"
              elif x["spread"] is None: reason="NO_HISTORICAL_SPREAD"
              elif x["spread"]>0.5: reason="SPREAD_TOO_WIDE"
              elif finite(x["structural_range"],0)<6.0: reason="STRUCTURAL_RANGE_TOO_NARROW"
              elif not x["plan_valid"]: reason=x["plan_reason"] or "INVALID_PLAN"
              elif finite(x["stop_distance"],999)>10.0: reason="STRUCTURAL_STOP_TOO_WIDE"
              else:
                  executable.append(x)
                  reason="WOULD_PASS_V2_GATE"
              reasons[reason]+=1

          hi=max((x["h"] for x in c5 if x["t"]/1000>=now-24*3600),default=current_price)
          lo=min((x["l"] for x in c5 if x["t"]/1000>=now-24*3600),default=current_price)
          summary={
              "tracked_points":len(tracked),"confirmed_points":len(confirmed),
              "first_build":first_build,"first_confirm":first_conf,"max_score_point":maxrow,
              "would_pass_points":len(executable),"first_would_pass":executable[0] if executable else None,
              "gate_reason_counts":dict(reasons),
              "current_price":current_price,"high24":hi,"low24":lo,
              "from_first_build_to_current_pct":pct(first_build["price"],current_price) if first_build else None,
              "from_first_confirm_to_current_pct":pct(first_conf["price"],current_price) if first_conf else None,
              "from_first_pass_to_current_pct":pct(executable[0]["price"],current_price) if executable else None,
              "from_first_confirm_to_high24_pct":pct(first_conf["price"],hi) if first_conf else None,
              "from_first_pass_to_high24_pct":pct(executable[0]["price"],hi) if executable else None,
              "spread_snapshots":len(spreads),
          }
          print("FET_SUMMARY="+json.dumps(summary,separators=(",",":")))
          print("FET_TRACKED="+json.dumps(tracked,separators=(",",":")))
          PY
