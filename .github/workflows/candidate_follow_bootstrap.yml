name: Temporary bridge for autonomous post-BUY follow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/candidate_follow_bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: bitvavo-candidate-follow-bootstrap-once
  cancel-in-progress: false

jobs:
  bridge-follow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts
            research
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow public BUYs until updated heartbeat takes over
        env:
          GH_TOKEN: ${{ github.token }}
          FOLLOW_NOTIFY_ENABLED: 'true'
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: bellonirom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          git config user.name bitvavo-live-bot
          git config user.email actions@users.noreply.github.com

          publish_follow() {
            for file in production_candidate_follow_state.json production_candidate_follow_status.json production_candidate_follow_journal.json; do
              if [ -e "$file" ]; then git add "$file"; fi
            done
            if git diff --cached --quiet; then return 0; fi
            git commit -m 'Persist bridge candidate follow-up evidence'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                return 1
              fi
              if git push origin HEAD:main; then return 0; fi
              sleep $((attempt * 2))
            done
            return 1
          }

          for tick in $(seq 1 34); do
            # The old heartbeat started before deployment. Stop when a newer
            # production heartbeat run takes over, preventing double polling.
            newer_active="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/production_scan_fast.yml/runs?status=in_progress&per_page=30" --jq '[.workflow_runs[] | select(.id > 37967933797)] | length' 2>/dev/null || echo 0)"
            if [ "$newer_active" -gt 0 ]; then
              publish_follow
              echo 'UPDATED_HEARTBEAT_ACTIVE: bridge completed'
              exit 0
            fi

            if ! python scripts/follow_active_candidates.py; then
              echo 'BRIDGE_FOLLOW_PROBE_DEGRADED: retrying' >&2
            fi
            if [ $((tick % 5)) -eq 0 ]; then publish_follow; fi
            sleep 60
          done
          publish_follow
          echo 'BRIDGE_DURATION_COMPLETED'
