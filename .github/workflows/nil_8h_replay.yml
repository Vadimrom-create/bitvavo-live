name: NIL 8h Solaire replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nil_8h_replay.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay NIL over last 8h
        run: |
          python - <<'PY'
          import json, time, sys
          from datetime import datetime, timezone
          from research.http import PublicClient
          from research.features import closed_candles, describe
          from research.production_acceleration import acceleration_signal

          client = PublicClient(timeout=12, retries=3, requests_per_second=8)
          client.get("/time", cache=False)
          now = time.time()
          raw5 = client.get("/NIL-EUR/candles", {"interval":"5m","limit":100}, cache=False)
          raw15 = client.get("/NIL-EUR/candles", {"interval":"15m","limit":100}, cache=False)
          ticker = client.get("/ticker/24h", {"market":"NIL-EUR"}, cache=False)

          def ts_iso(ts):
              return datetime.fromtimestamp(ts, timezone.utc).isoformat()

          # Determine replay points from the actual 5m candle starts returned.
          rows = sorted(raw5, key=lambda r: int(r[0]))
          starts = [int(r[0])/1000 for r in rows]
          cutoff = now - 8*3600
          replay_points = [s + 300 + 1 for s in starts if s + 300 + 1 >= cutoff and s + 300 + 1 <= now]

          out=[]
          for signal_ts in replay_points:
              c5 = closed_candles(raw5, "5m", signal_ts)
              c15 = closed_candles(raw15, "15m", signal_ts)
              f5 = describe(c5, "5m")
              f15 = describe(c15, "15m")
              if not c5:
                  continue
              sig = acceleration_signal({"features":{"5m":f5,"15m":f15}})
              out.append({
                  "signal_at_utc": ts_iso(signal_ts),
                  "price_eur": c5[-1]["c"],
                  "state": sig["state"],
                  "score": sig["score"],
                  "evidence_count": sig["evidence_count"],
                  "components": sig["components"],
              })

          prices=[float(x["price_eur"]) for x in out]
          first=prices[0] if prices else None
          last=prices[-1] if prices else None
          summary={
              "market":"NIL-EUR",
              "generated_at_utc":ts_iso(now),
              "points":len(out),
              "first_price_eur":first,
              "last_price_eur":last,
              "change_8h_pct":((last/first)-1)*100 if first and last else None,
              "low_8h_eur":min(prices) if prices else None,
              "high_8h_eur":max(prices) if prices else None,
              "ticker_24h":ticker,
              "signals":[x for x in out if x["state"]!="NO_ACCELERATION"],
              "all_points":out,
          }
          print("NIL_REPLAY_JSON="+json.dumps(summary,separators=(",",":")))
          PY
