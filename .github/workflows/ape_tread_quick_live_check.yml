name: APE TREAD quick live check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ape_tread_quick_live_check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check APE and TREAD
        run: |
          python - <<'PY'
          import json,time
          from research.http import PublicClient
          from research.common import finite
          from research.features import describe

          c=PublicClient(timeout=12,retries=2,requests_per_second=6)
          now=time.time()
          tickers={x["market"]:x for x in c.get("/ticker/24h")}

          def closed(market,interval,limit,dur_ms):
              raw=c.get("/"+market+"/candles",{"interval":interval,"limit":limit},cache=False)
              obs={}
              for r in raw:
                  if not isinstance(r,list) or len(r)<6: continue
                  vals=[finite(x) for x in r[:6]]
                  if any(v is None for v in vals): continue
                  t,o,h,l,cl,v=vals;t=int(t)
                  if t+dur_ms>now*1000: continue
                  obs[t]={"t":t,"o":o,"h":h,"l":l,"c":cl,"v":v,"bar_status":"CLOSED_TRADE"}
              if not obs:return []
              ks=sorted(obs);out=[];prev=None;x=ks[0]
              while x<=ks[-1]:
                  row=obs.get(x)
                  if row is not None:
                      prev=row["c"];out.append(row)
                  elif prev is not None:
                      out.append({"t":x,"o":prev,"h":prev,"l":prev,"c":prev,"v":0.0,"bar_status":"NO_TRADE"})
                  x+=dur_ms
              return out

          for market in ["APE-EUR","TREAD-EUR"]:
              tk=tickers[market]
              book=c.get("/"+market+"/book",{"depth":25},cache=False)
              c5=closed(market,"5m",120,300000)
              c15=closed(market,"15m",120,900000)
              f5=describe(c5[-100:],"5m"); f15=describe(c15[-100:],"15m")
              bid=float(book["bids"][0][0]); ask=float(book["asks"][0][0])
              def depth(side,n=10): return sum(float(p)*float(q) for p,q in side[:n])
              bd=depth(book.get("bids",[])); ad=depth(book.get("asks",[]))
              print("LIVE="+json.dumps({
                "market":market,
                "last":float(tk["last"]),
                "bid":bid,"ask":ask,"spread_pct":(ask/bid-1)*100,
                "bid_depth":bd,"ask_depth":ad,
                "imbalance":(bd-ad)/(bd+ad) if bd+ad else None,
                "recent1h_low":min(x["l"] for x in c5[-12:]),
                "recent1h_high":max(x["h"] for x in c5[-12:]),
                "recent2h_low":min(x["l"] for x in c15[-8:]),
                "recent2h_high":max(x["h"] for x in c15[-8:]),
                "f5":f5,"f15":f15
              },separators=(",",":")))
          PY
