name: Swing Selector v1 Robustness Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/swing_selector.py'
      - 'scripts/audit_swing_selector_v1.py'
      - '.github/workflows/swing_selector_v1_robustness.yml'

permissions:
  contents: write

concurrency:
  group: swing-selector-v1-robustness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            research
            history
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: |
          python -m py_compile research/swing_selector.py
          python -m py_compile scripts/audit_swing_selector_v1.py

      - name: Run robustness audit
        run: python scripts/audit_swing_selector_v1.py

      - name: Validate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/swing_selector_v1_robustness_latest.json'))
          assert p['measurement_only'] is True
          assert p['clean_out_of_sample'] is False
          assert p['snapshot_count'] > 20
          assert p['event_counts']['swing_human_review'] > 10
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing-selector-v1-robustness-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            research/swing_selector_v1_robustness_latest.json
            research/swing_selector_v1_robustness_latest.md

      - name: Persist report
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/swing_selector_v1_robustness_latest.json research/swing_selector_v1_robustness_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update swing selector v1 robustness audit'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
