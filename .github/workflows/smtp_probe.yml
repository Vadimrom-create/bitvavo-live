name: Solaire SMTP probe

on:
  push:
    branches:
      - codex/smtp-probe-20260921
    paths:
      - '.github/workflows/smtp_probe.yml'

permissions:
  contents: read

jobs:
  smtp-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate to Gmail SMTP and send one test message
        env:
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: bellonirom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage

          user = os.getenv("ALERT_GMAIL_USER", "").strip()
          recipient = os.getenv("ALERT_EMAIL_TO", "").strip()
          password = os.getenv("GMAIL_APP_PASSWORD", "").strip().replace(" ", "")
          if not user or not recipient or not password:
              raise SystemExit("SMTP_CONFIG_MISSING")

          msg = EmailMessage()
          msg["Subject"] = "✅ Test Solaire — Gmail SMTP opérationnel"
          msg["From"] = user
          msg["To"] = recipient
          msg.set_content(
              "Test unique de la chaîne GitHub Actions → Gmail SMTP de Solaire.\n"
              "Si tu reçois ce message, le nouveau mot de passe d’application est valide."
          )

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              context=ssl.create_default_context(),
              timeout=20,
          ) as smtp:
              smtp.login(user, password)
              smtp.send_message(msg)

          print("SMTP_PROBE_OK")
          PY
