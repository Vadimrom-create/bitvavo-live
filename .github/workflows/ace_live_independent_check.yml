name: ACE live independent check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ace_live_independent_check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent ACE live check
        run: |
          python - <<'PY'
          import json,time,statistics
          from research.http import PublicClient
          from research.common import finite
          from research.features import describe

          c=PublicClient(timeout=12,retries=2,requests_per_second=6)
          c.get("/time",cache=False)
          now=time.time()
          ticker=next(x for x in c.get("/ticker/24h") if x.get("market")=="ACE-EUR")
          book=c.get("/ACE-EUR/book",{"depth":25},cache=False)

          def closed(interval,limit,dur_ms):
              raw=c.get("/ACE-EUR/candles",{"interval":interval,"limit":limit},cache=False)
              out=[]
              for r in raw:
                  if not isinstance(r,list) or len(r)<6: continue
                  vals=[finite(x) for x in r[:6]]
                  if any(v is None for v in vals): continue
                  t,o,h,l,cl,v=vals
                  if int(t)+dur_ms>now*1000: continue
                  out.append({"t":int(t),"o":o,"h":h,"l":l,"c":cl,"v":v,"bar_status":"CLOSED_TRADE"})
              return sorted(out,key=lambda x:x["t"])
          c5=closed("5m",80,300000)
          c15=closed("15m",80,900000)
          f5=describe(c5[-100:],"5m")
          f15=describe(c15[-100:],"15m")

          bid=float(book["bids"][0][0]); ask=float(book["asks"][0][0])
          spread=(ask/bid-1)*100
          def depth(side, n=10):
              total=0.0
              for p,q in side[:n]:
                  total += float(p)*float(q)
              return total
          bid_depth=depth(book.get("bids",[]),10)
          ask_depth=depth(book.get("asks",[]),10)
          imbalance=(bid_depth-ask_depth)/(bid_depth+ask_depth) if bid_depth+ask_depth else None

          mail_entry=0.1525
          last=float(ticker["last"])
          since_mail=(last/mail_entry-1)*100
          recent5=c5[-12:]
          recent15=c15[-8:]
          hi5=max(x["h"] for x in recent5); lo5=min(x["l"] for x in recent5)
          hi15=max(x["h"] for x in recent15); lo15=min(x["l"] for x in recent15)

          out={
            "ts":now,
            "ticker":ticker,
            "bid":bid,"ask":ask,"spread_pct":spread,
            "bid_depth_top10_eur":bid_depth,
            "ask_depth_top10_eur":ask_depth,
            "book_imbalance_top10":imbalance,
            "since_mail_entry_pct":since_mail,
            "last_12x5m":{"high":hi5,"low":lo5,"bars":recent5},
            "last_8x15m":{"high":hi15,"low":lo15,"bars":recent15},
            "features5":f5,
            "features15":f15
          }
          print("ACE_LIVE="+json.dumps(out,separators=(",",":")))
          PY
