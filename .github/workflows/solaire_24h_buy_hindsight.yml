name: Solaire 24h buy hindsight audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solaire_24h_buy_hindsight.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit last 24h BUY mails
        run: |
          python - <<'PY'
          import json, time, datetime as dt
          from research.http import PublicClient

          trades = [
            {"m":"DRIFT-EUR","ts":"2026-09-21T09:15:59Z","entry":0.015558,"stop":0.014316,"tp":0.018042,"stake":138.65},
            {"m":"BONK-EUR","ts":"2026-09-21T09:34:33Z","entry":2.8797e-6,"stop":2.6269e-6,"tp":3.3853e-6,"stake":127.01},
            {"m":"KMNO-EUR","ts":"2026-09-21T09:50:30Z","entry":0.030916,"stop":0.028836,"tp":0.035075,"stake":162.07},
            {"m":"TREAD-EUR","ts":"2026-09-21T10:05:02Z","entry":0.38501,"stop":0.36549,"tp":0.42405,"stake":208.61},
            {"m":"ARB-EUR","ts":"2026-09-21T10:55:49Z","entry":0.20236,"stop":0.187,"tp":0.23308,"stake":145.21},
            {"m":"G-EUR","ts":"2026-09-21T11:34:48Z","entry":0.0058365,"stop":0.0053955,"tp":0.0067184,"stake":145.82},
            {"m":"PROVE-EUR","ts":"2026-09-21T12:48:12Z","entry":0.22712,"stop":0.20983,"tp":0.2617,"stake":144.82},
            {"m":"C-EUR","ts":"2026-09-21T13:22:20Z","entry":0.068052,"stop":0.064349,"tp":0.075458,"stake":196.00},
            {"m":"CELR-EUR","ts":"2026-09-21T13:56:23Z","entry":0.0031493,"stop":0.0029679,"tp":0.003512,"stake":186.34},
            {"m":"ACE-EUR","ts":"2026-09-21T15:25:10Z","entry":0.1525,"stop":0.14572,"tp":0.16606,"stake":233.90},
            {"m":"ALLO-EUR","ts":"2026-09-21T16:35:25Z","entry":0.243967,"stop":0.226338,"tp":0.279224,"stake":151.89},
            {"m":"GRASS-EUR","ts":"2026-09-21T20:18:07Z","entry":0.34572,"stop":0.31894,"tp":0.39928,"stake":142.53},
            {"m":"TAO-EUR","ts":"2026-09-21T20:20:09Z","entry":269.88,"stop":243.48,"tp":322.68,"stake":114.86},
            {"m":"COTI-EUR","ts":"2026-09-21T21:21:29Z","entry":0.01346,"stop":0.012835,"tp":0.01471,"stake":225.26},
            {"m":"ZETA-EUR","ts":"2026-09-22T00:27:02Z","entry":0.051019,"stop":0.046926,"tp":0.059205,"stake":138.02},
            {"m":"EPIC-EUR","ts":"2026-09-22T02:57:00Z","entry":0.56687,"stop":0.51956,"tp":0.66148,"stake":133.09},
            {"m":"NIL-EUR","ts":"2026-09-22T06:33:20Z","entry":0.064545,"stop":0.05919,"tp":0.075255,"stake":133.82},
            {"m":"CARV-EUR","ts":"2026-09-22T06:36:24Z","entry":0.040426,"stop":0.036778,"tp":0.047721,"stake":123.81},
            {"m":"FORM-EUR","ts":"2026-09-22T07:30:30Z","entry":0.27632,"stop":0.26476,"tp":0.29944,"stake":246.46},
            {"m":"S-EUR","ts":"2026-09-22T07:47:36Z","entry":0.037651,"stop":0.034774,"tp":0.043404,"stake":144.33},
            {"m":"KERNEL-EUR","ts":"2026-09-22T07:47:36Z","entry":0.05833,"stop":0.053527,"tp":0.067936,"stake":134.75},
          ]

          c=PublicClient(timeout=15,retries=2,requests_per_second=7)
          tickers={x["market"]:x for x in c.get("/ticker/24h")}
          now_ms=int(time.time()*1000)

          def iso_ms(s):
              return int(dt.datetime.fromisoformat(s.replace("Z","+00:00")).timestamp()*1000)

          out=[]
          for t in trades:
              m=t["m"]; start=iso_ms(t["ts"])
              tk=tickers[m]
              current=float(tk["last"])
              raw=c.get("/"+m+"/candles",{"interval":"1m","limit":1440},cache=False)
              bars=[]
              for r in raw:
                  if not isinstance(r,list) or len(r)<6: continue
                  ts=int(float(r[0]))
                  if ts < (start//60000)*60000: continue
                  bars.append((ts,float(r[2]),float(r[3]),float(r[4])))
              bars.sort()
              first=None; ambiguous=False
              mfe=-1e9; mae=1e9
              for ts,h,l,cl in bars:
                  # first minute may partly precede the email; flag any hit there as ambiguous
                  mfe=max(mfe,(h/t["entry"]-1)*100)
                  mae=min(mae,(l/t["entry"]-1)*100)
                  hit_tp=h>=t["tp"]; hit_sl=l<=t["stop"]
                  if first is None and (hit_tp or hit_sl):
                      if hit_tp and hit_sl:
                          first=("AMBIGUOUS",ts); ambiguous=True
                      elif ts == (start//60000)*60000:
                          first=(("TP1" if hit_tp else "STOP")+"_FIRST_MINUTE_AMBIGUOUS",ts); ambiguous=True
                      else:
                          first=("TP1" if hit_tp else "STOP",ts)
              hold_ret=(current/t["entry"]-1)*100
              hold_value=t["stake"]*(current/t["entry"])
              if first and first[0]=="TP1":
                  policy_exit=t["tp"]; policy_status="TP1"
              elif first and first[0]=="STOP":
                  policy_exit=t["stop"]; policy_status="STOP"
              elif first and "AMBIGUOUS" in first[0]:
                  policy_exit=None; policy_status=first[0]
              else:
                  policy_exit=current; policy_status="OPEN"
              policy_value=(t["stake"]*(policy_exit/t["entry"])) if policy_exit is not None else None
              out.append({
                **t,"current":current,"hold_ret_pct":hold_ret,"hold_value":hold_value,
                "policy_status":policy_status,"policy_value":policy_value,
                "first_event_ts": first[1] if first else None,
                "mfe_pct":mfe if mfe>-1e8 else None,"mae_pct":mae if mae<1e8 else None
              })
          print("AUDIT="+json.dumps(out,separators=(",",":")))
          PY
