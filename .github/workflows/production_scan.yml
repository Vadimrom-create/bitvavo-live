name: Solaire direct Bitvavo scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production_scan.py'
      - 'scripts/send_production_buy_alert.py'
      - 'research/production_gate.py'
      - 'research/production_acceleration.py'
      - 'research/production_alerts.py'
      - 'research/production_context.py'
      - 'research/production_journal.py'
      - 'research/persistent_building.py'
      - 'scripts/update_production_evaluation.py'
      - 'scripts/update_persistent_building_shadow.py'
      - 'scripts/update_early_building_shadow.py'
      - 'scripts/update_v21_range5_shadow.py'
      - 'scripts/update_rejection_shadow.py'
      - 'scripts/update_all_actionable_shadow.py'
      - 'scripts/update_breakout_risk_shadow.py'
      - 'scripts/update_emerging_liquidity_shadow.py'
      - 'scripts/update_exit_policy_shadow.py'
      - 'scripts/check_production_health.py'
      - 'scripts/solaire_v3_shadow.py'
      - 'scripts/update_solaire_v3_evaluation.py'
      - 'research/solaire_v3.py'
      - 'scripts/solaire_v31_shadow.py'
      - 'scripts/update_solaire_v31_evaluation.py'
      - 'scripts/solaire_funnel_audit.py'
      - 'research/solaire_funnel_audit.py'
      - 'scripts/solaire_policy_challengers.py'
      - 'scripts/update_solaire_policy_challengers_evaluation.py'
      - 'research/solaire_v31.py'
      - 'research/features.py'
      - 'research/risk.py'
      - '.github/workflows/production_scan.yml'
  schedule:
    - cron: '1-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: bitvavo-production-direct
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Direct full-universe production scan
        run: python scripts/production_scan.py

      - name: Publish production scan state
        id: publish_scan
        continue-on-error: true
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add production_alert_candidates.json production_scan_status.json production_universe_snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record direct production scan'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Measure all simultaneously actionable candidates
        id: all_actionable_shadow
        continue-on-error: true
        run: python scripts/update_all_actionable_shadow.py

      - name: Revalidate and send only actionable BUY
        env:
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: bellonirom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_production_buy_alert.py

      - name: Run Solaire V3 prospective shadow
        id: solaire_v3_shadow
        if: always()
        continue-on-error: true
        run: python scripts/solaire_v3_shadow.py

      - name: Update Solaire V3 prospective evaluation
        id: solaire_v3_evaluation
        if: always()
        continue-on-error: true
        run: python scripts/update_solaire_v3_evaluation.py

      - name: Run Solaire V3.1 economic challenger shadow
        id: solaire_v31_shadow
        if: always()
        continue-on-error: true
        run: python scripts/solaire_v31_shadow.py

      - name: Update Solaire V3.1 prospective evaluation
        id: solaire_v31_evaluation
        if: always()
        continue-on-error: true
        run: python scripts/update_solaire_v31_evaluation.py

      - name: Run Solaire full-funnel measurement audit
        id: solaire_funnel_audit
        if: always()
        continue-on-error: true
        run: python scripts/solaire_funnel_audit.py

      - name: Run Solaire policy challenger shadows
        id: solaire_policy_challengers
        if: always()
        continue-on-error: true
        run: python scripts/solaire_policy_challengers.py

      - name: Update Solaire policy challenger evaluation
        id: solaire_policy_challengers_evaluation
        if: always()
        continue-on-error: true
        run: python scripts/update_solaire_policy_challengers_evaluation.py

      - name: Update prospective decision evaluation
        if: always()
        run: python scripts/update_production_evaluation.py

      - name: Update persistent BUILDING shadow measurement
        id: persistent_building
        if: always()
        continue-on-error: true
        run: python scripts/update_persistent_building_shadow.py

      - name: Update immediate high-quality BUILDING shadow
        id: early_building_shadow
        if: always()
        continue-on-error: true
        run: python scripts/update_early_building_shadow.py

      - name: Update V2.1 range-5 shadow
        id: v21_range5_shadow
        if: always()
        continue-on-error: true
        run: python scripts/update_v21_range5_shadow.py

      - name: Update emerging-liquidity shadow
        id: emerging_liquidity_shadow
        if: always()
        continue-on-error: true
        run: python scripts/update_emerging_liquidity_shadow.py

      - name: Update fast breakout-risk shadow
        id: breakout_risk_shadow
        if: always()
        continue-on-error: true
        run: python scripts/update_breakout_risk_shadow.py

      - name: Update final-gate rejection shadow
        id: rejection_shadow
        if: always()
        continue-on-error: true
        run: python scripts/update_rejection_shadow.py

      - name: Update exit-policy shadow
        id: exit_policy_shadow
        if: always()
        continue-on-error: true
        run: python scripts/update_exit_policy_shadow.py

      - name: Check Solaire production health
        if: always()
        env:
          SCAN_PUBLISH_OUTCOME: ${{ steps.publish_scan.outcome }}
          PERSISTENT_BUILDING_OUTCOME: ${{ steps.persistent_building.outcome }}
          EARLY_BUILDING_OUTCOME: ${{ steps.early_building_shadow.outcome }}
          V21_RANGE5_OUTCOME: ${{ steps.v21_range5_shadow.outcome }}
          REJECTION_SHADOW_OUTCOME: ${{ steps.rejection_shadow.outcome }}
          ALL_ACTIONABLE_OUTCOME: ${{ steps.all_actionable_shadow.outcome }}
          BREAKOUT_RISK_OUTCOME: ${{ steps.breakout_risk_shadow.outcome }}
          EMERGING_LIQUIDITY_OUTCOME: ${{ steps.emerging_liquidity_shadow.outcome }}
          EXIT_POLICY_OUTCOME: ${{ steps.exit_policy_shadow.outcome }}
        run: python scripts/check_production_health.py

      - name: Persist Solaire runtime state
        if: always()
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          for file in             production_alert_state.json             production_alert_status.json             production_decision_journal.json             production_evaluation_status.json             production_persistent_building_state.json             production_persistent_building_journal.json             production_persistent_building_status.json             production_early_building_shadow_state.json             production_early_building_shadow_journal.json             production_early_building_shadow_status.json             production_v21_range5_shadow_state.json             production_v21_range5_shadow_journal.json             production_v21_range5_shadow_status.json             production_rejection_shadow_state.json             production_rejection_shadow_journal.json             production_rejection_shadow_status.json             production_all_actionable_shadow_journal.json             production_all_actionable_shadow_status.json             production_breakout_risk_shadow_state.json             production_breakout_risk_shadow_journal.json             production_breakout_risk_shadow_status.json             production_emerging_liquidity_shadow_state.json             production_emerging_liquidity_shadow_journal.json             production_emerging_liquidity_shadow_status.json             production_exit_policy_shadow_state.json             production_exit_policy_shadow_journal.json             production_exit_policy_shadow_status.json             solaire_v3_state.json             solaire_v3_journal.json             solaire_v3_status.json             solaire_v3_candidates.json             solaire_v3_theses.json             solaire_v3_rotation_state.json             solaire_v2_frozen_benchmark_journal.json             solaire_v2_reference_outcomes.json             solaire_v3_evaluation_status.json             solaire_v3_comparison.json             solaire_v31_state.json             solaire_v31_journal.json             solaire_v31_status.json             solaire_v31_candidates.json             solaire_v31_portfolio.json             solaire_v31_portfolio_persist30.json             solaire_v31_portfolio_pullback_reclaim.json             solaire_v31_portfolio_raw.json             solaire_v31_portfolio_reentry.json             solaire_policy_challengers_journal.json             solaire_policy_challengers_portfolios.json             solaire_policy_challengers_status.json             solaire_policy_challengers_comparison.json             solaire_policy_challengers_evaluation_status.json             solaire_v31_evaluation_status.json             solaire_v31_comparison.json             solaire_funnel_audit_state.json             solaire_funnel_audit_journal.json             solaire_funnel_audit_report.json             solaire_funnel_audit_status.json             production_health.json; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist Solaire V2, V3 and V3.1 runtime state'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
