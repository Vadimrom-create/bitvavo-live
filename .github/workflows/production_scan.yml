name: Production direct Bitvavo scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production_scan.py'
      - 'scripts/send_production_buy_alert.py'
      - 'research/production_gate.py'
      - 'research/feedback_loop.py'
      - 'research/features.py'
      - 'email_alert_v4.py'
      - '.github/workflows/production_scan.yml'
  schedule:
    - cron: '1-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: bitvavo-production-direct
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Direct full-universe production scan
        run: python scripts/production_scan.py

      - name: Publish production scan state
        continue-on-error: true
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add production_alert_candidates.json production_scan_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record direct production scan'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Revalidate and send only actionable BUY
        env:
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: bellonirom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_production_buy_alert.py

      - name: Persist production anti-spam state
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add production_alert_state.json production_alert_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist production alert state'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
