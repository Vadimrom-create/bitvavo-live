name: Solaire 96h walk-forward audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solaire_96h_walkforward.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Walk-forward 96h across full Bitvavo EUR universe
        run: |
          python - <<'PY'
          import bisect, gzip, json, math, re, time
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path

          from research.common import finite, INTERVAL_MS
          from research.features import describe
          from research.http import PublicClient
          from research.production_acceleration import acceleration_signal
          from research.risk import structural_plan

          H96=96*3600
          H72=72*3600
          WARMUP=9*3600
          MAX_SPREAD_PCT=0.5
          MIN_QV=75000.0
          MAX_STOP=10.0
          THESIS_TTL=24*3600

          started=time.time()
          client=PublicClient(timeout=18,retries=3,requests_per_second=12)
          client.get("/time",cache=False)
          now=time.time()
          audit_start=now-H96
          fetch_start=audit_start-WARMUP

          markets=[m for m in client.get("/markets") if m.get("quote")=="EUR" and m.get("status")=="trading"]
          meta={m["market"]:m for m in markets}

          def fetch_one(m):
              try:
                  # 96h + warm-up fits under Bitvavo's 1440-candle maximum at 5m.
                  r5=client.get("/"+m+"/candles",{"interval":"5m","limit":1440},cache=False)
                  r15=client.get("/"+m+"/candles",{"interval":"15m","limit":500},cache=False)
                  return m,r5,r15,None
              except Exception as exc:
                  return m,[],[],type(exc).__name__+":"+str(exc)

          raw={}
          with ThreadPoolExecutor(max_workers=12) as ex:
              fs=[ex.submit(fetch_one,m["market"]) for m in markets]
              for f in as_completed(fs):
                  m,r5,r15,err=f.result()
                  raw[m]=(r5,r15,err)

          def canonical(rows, interval):
              dur=INTERVAL_MS[interval]
              obs={}
              for r in rows:
                  if not isinstance(r,list) or len(r)<6: continue
                  vals=[finite(v) for v in r[:6]]
                  if any(v is None for v in vals): continue
                  t,o,h,l,c,v=vals
                  t=int(t)
                  if t+dur>now*1000 or t%dur or min(o,h,l,c)<=0 or v<0: continue
                  obs[t]={"t":t,"o":o,"h":h,"l":l,"c":c,"v":v,
                          "bar_status":"CLOSED_TRADE"}
              if not obs: return []
              times=sorted(obs)
              out=[];prev=None;t=times[0];end=times[-1]
              while t<=end:
                  row=obs.get(t)
                  if row is not None:
                      prev=row["c"];out.append(row)
                  elif prev is not None:
                      out.append({"t":t,"o":prev,"h":prev,"l":prev,"c":prev,"v":0.0,
                                  "bar_status":"NO_TRADE"})
                  t+=dur
              return out

          series={}
          for m,(r5,r15,err) in raw.items():
              series[m]=(canonical(r5,"5m"),canonical(r15,"15m"),err)

          def feat_at(cs,interval,ts):
              dur=INTERVAL_MS[interval]
              starts=[x["t"] for x in cs]
              idx=bisect.bisect_right(starts,int(ts*1000)-dur)
              if idx<=0:return {"valid":False,"reasons":["NO_HISTORY"]},None,idx
              sub=cs[max(0,idx-100):idx]
              return describe(sub,interval),sub[-1]["c"],idx

          def rolling_qv(c5,idx):
              return sum(x["v"]*x["c"] for x in c5[max(0,idx-288):idx])

          # Historical spread/ask snapshots. Use only the latest snapshot at or BEFORE
          # the decision time: never nearest-future data.
          spread_index=defaultdict(list)
          rx=re.compile(r"(\d{8}T\d{6}Z)")
          def walk(obj,fts):
              if isinstance(obj,dict):
                  mk=obj.get("market")
                  if mk in meta:
                      sp=finite(obj.get("spread_pct"))
                      bid=finite(obj.get("bid")); ask=finite(obj.get("ask"))
                      if sp is None and bid and ask and bid>0 and ask>=bid:
                          sp=(ask/bid-1)*100
                      if sp is not None:
                          spread_index[mk].append((fts,sp,ask))
                  for v in obj.values(): walk(v,fts)
              elif isinstance(obj,list):
                  for v in obj: walk(v,fts)

          for folder in ["history/2026-09-16","history/2026-09-17","history/2026-09-18",
                         "history/2026-09-19","history/2026-09-20","history/2026-09-21"]:
              p=Path(folder)
              if not p.exists(): continue
              for path in p.glob("*.json.gz"):
                  mm=rx.search(path.name)
                  if not mm: continue
                  fts=datetime.strptime(mm.group(1),"%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc).timestamp()
                  if fts<audit_start-1800 or fts>now+60: continue
                  try:
                      with gzip.open(path,"rt",encoding="utf-8") as fh:
                          walk(json.load(fh),fts)
                  except Exception:
                      pass
          for m in spread_index:
              spread_index[m].sort()

          def prior_spread(m,ts,max_age=20*60):
              xs=spread_index.get(m,[])
              if not xs:return None
              times=[x[0] for x in xs]
              i=bisect.bisect_right(times,ts)-1
              if i<0:return None
              fts,sp,ask=xs[i]
              if ts-fts>max_age:return None
              return {"ts":fts,"age_sec":ts-fts,"spread_pct":sp,"ask":ask}

          def outcome(c5,ts,plan,horizon_sec=12*3600):
              end=ts+horizon_sec
              entry=plan["entry_eur"];stop=plan["stop_eur"];tp1=plan["tp1_eur"]
              hi=entry;lo=entry
              for x in c5:
                  xt=x["t"]/1000
                  if xt<ts or xt>end:continue
                  hi=max(hi,x["h"]);lo=min(lo,x["l"])
                  sh=x["l"]<=stop; th=x["h"]>=tp1
                  if sh and th:
                      return {"result":"STOP_SAME_BAR_CONSERVATIVE","event_ts":xt,
                              "mfe_pct":(hi/entry-1)*100,"mae_pct":(lo/entry-1)*100}
                  if sh:
                      return {"result":"STOP","event_ts":xt,
                              "mfe_pct":(hi/entry-1)*100,"mae_pct":(lo/entry-1)*100}
                  if th:
                      return {"result":"TP1","event_ts":xt,
                              "mfe_pct":(hi/entry-1)*100,"mae_pct":(lo/entry-1)*100}
              return {"result":"OPEN","event_ts":None,
                      "mfe_pct":(hi/entry-1)*100,"mae_pct":(lo/entry-1)*100}

          # Precompute every 5m signal using only data available at that timestamp.
          signals={}
          for m,(c5,c15,err) in series.items():
              if not c5 or not c15:
                  signals[m]=[];continue
              rows=[]
              for bar in c5:
                  ts=bar["t"]/1000+301
                  if ts<audit_start or ts>now:continue
                  f5,p,idx5=feat_at(c5,"5m",ts)
                  f15,_,_=feat_at(c15,"15m",ts)
                  sig=acceleration_signal({"features":{"5m":f5,"15m":f15}})
                  rows.append({"ts":ts,"price":p,"idx5":idx5,"f15":f15,
                               "state":sig.get("state"),"score":sig.get("score"),
                               "evidence":int(sig.get("evidence_count") or 0)})
              signals[m]=rows

          # Simulate current V3 thesis-aware BUY policy, one handled alert per acceleration
          # episode, re-entry only after prior stop breach/24h expiry. Failed execution gate
          # does not mark an episode handled, because production retries within that episode.
          mails=[]
          market_stats={}
          for m in meta:
              c5,c15,err=series.get(m,([],[],None))
              rows=signals.get(m,[])
              episode=0;active=False;handled_episode=0
              thesis=None
              market_mails=[]
              confirmed_episodes=0
              for r in rows:
                  tracked=r["state"] in ("BUILDING_ACCELERATION","CONFIRMED_ACCELERATION")
                  if not tracked:
                      active=False
                      continue
                  if not active:
                      episode+=1;active=True
                  if r["state"]!="CONFIRMED_ACCELERATION":
                      continue
                  if episode==handled_episode:
                      continue
                  confirmed_episodes += 1 if not any(x.get("_ep")==episode for x in market_mails) else 0

                  ts=r["ts"]
                  # Active prior thesis suppresses and handles this new episode.
                  if thesis is not None:
                      expired=ts-thesis["sent_ts"]>THESIS_TTL
                      breached=False
                      if not expired:
                          lows=[x["l"] for x in c5
                                if thesis["sent_ts"]*1000 <= x["t"] < ts*1000]
                          breached=(bool(lows) and min(lows)<=thesis["stop"])
                      if not expired and not breached:
                          handled_episode=episode
                          continue
                      thesis=None

                  qv=rolling_qv(c5,r["idx5"])
                  if qv<MIN_QV:
                      continue
                  hs=prior_spread(m,ts)
                  if hs is None:
                      continue
                  if hs["spread_pct"]>MAX_SPREAD_PCT:
                      continue
                  ask=hs["ask"] if hs.get("ask") else r["price"]
                  plan=structural_plan({"market":m,"ask":ask},r["f15"],meta[m])
                  if not plan.get("valid"):
                      continue
                  if finite(plan.get("stop_distance_pct"),999)>MAX_STOP:
                      handled_episode=episode
                      continue

                  mail={"market":m,"ts":ts,"price":r["price"],"score":r["score"],
                        "evidence":r["evidence"],"qv":qv,"spread_pct":hs["spread_pct"],
                        "spread_age_sec":hs["age_sec"],"entry":plan["entry_eur"],
                        "stop":plan["stop_eur"],"tp1":plan["tp1_eur"],
                        "stop_distance_pct":plan["stop_distance_pct"],"_ep":episode}
                  mail["outcome12h"]=outcome(c5,ts,plan,12*3600)
                  mail["outcome4h"]=outcome(c5,ts,plan,4*3600)
                  mails.append(mail);market_mails.append(mail)
                  handled_episode=episode
                  thesis={"sent_ts":ts,"stop":plan["stop_eur"]}

              market_stats[m]={"episodes":episode,"mails":len(market_mails)}

          # Detection episode events for precision-like metrics.
          detections=[]
          for m,rows in signals.items():
              active=False;seen_confirm=False
              c5=series.get(m,([],[],None))[0]
              for r in rows:
                  tracked=r["state"] in ("BUILDING_ACCELERATION","CONFIRMED_ACCELERATION")
                  if not tracked:
                      active=False;seen_confirm=False;continue
                  if not active:
                      active=True;seen_confirm=False
                  if r["state"]=="CONFIRMED_ACCELERATION" and not seen_confirm:
                      seen_confirm=True
                      # Forward MFE from close-at-confirm, independent of execution gates.
                      price=r["price"]
                      f4=[x for x in c5 if r["ts"]*1000<=x["t"]<(r["ts"]+4*3600)*1000]
                      f12=[x for x in c5 if r["ts"]*1000<=x["t"]<(r["ts"]+12*3600)*1000]
                      detections.append({
                          "market":m,"ts":r["ts"],"price":price,"score":r["score"],
                          "mfe4h":(max((x["h"] for x in f4),default=price)/price-1)*100,
                          "mae4h":(min((x["l"] for x in f4),default=price)/price-1)*100,
                          "mfe12h":(max((x["h"] for x in f12),default=price)/price-1)*100,
                      })

          # Four rolling non-overlapping 24h windows. Rank by actual close-to-close return.
          windows=[]
          for k in range(4):
              ws=audit_start+k*24*3600; we=ws+24*3600
              ranking=[]
              for m,(c5,_,_) in series.items():
                  before=[x for x in c5 if x["t"]/1000 < ws]
                  endrows=[x for x in c5 if x["t"]/1000 < we]
                  if not before or not endrows:continue
                  p0=before[-1]["c"];p1=endrows[-1]["c"]
                  if p0>0:ranking.append((m,(p1/p0-1)*100))
              ranking.sort(key=lambda x:x[1],reverse=True)
              top30=ranking[:30]; top50=ranking[:50]
              def panel(panel):
                  names={m for m,_ in panel}
                  det=[d for d in detections if d["market"] in names and ws<=d["ts"]<we]
                  det_markets={d["market"] for d in det}
                  em=[x for x in mails if x["market"] in names and ws<=x["ts"]<we]
                  em_markets={x["market"] for x in em}
                  return {"n":len(panel),"confirmed_markets":len(det_markets),
                          "confirmed_recall_pct":round(100*len(det_markets)/len(panel),1) if panel else None,
                          "mail_markets":len(em_markets),
                          "mail_recall_pct":round(100*len(em_markets)/len(panel),1) if panel else None}
              windows.append({
                  "index":k+1,
                  "start_utc":datetime.fromtimestamp(ws,timezone.utc).isoformat(),
                  "end_utc":datetime.fromtimestamp(we,timezone.utc).isoformat(),
                  "top30":panel(top30),"top50":panel(top50),
                  "leaders":[{"market":m,"return_pct":round(ret,3)} for m,ret in top30[:10]],
              })

          def summarize_period(start_ts,end_ts):
              ds=[d for d in detections if start_ts<=d["ts"]<end_ts]
              ms=[m for m in mails if start_ts<=m["ts"]<end_ts]
              o12=[m["outcome12h"]["result"] for m in ms]
              o4=[m["outcome4h"]["result"] for m in ms]
              return {
                  "hours":round((end_ts-start_ts)/3600,1),
                  "detections":len(ds),
                  "detection_markets":len({d["market"] for d in ds}),
                  "detections_mfe4h_ge5_pct":round(100*sum(d["mfe4h"]>=5 for d in ds)/len(ds),1) if ds else None,
                  "detections_mfe4h_ge10_pct":round(100*sum(d["mfe4h"]>=10 for d in ds)/len(ds),1) if ds else None,
                  "buy_mails":len(ms),
                  "buy_mail_markets":len({m["market"] for m in ms}),
                  "4h_tp1":o4.count("TP1"),"4h_stop":o4.count("STOP")+o4.count("STOP_SAME_BAR_CONSERVATIVE"),
                  "4h_open":o4.count("OPEN"),
                  "12h_tp1":o12.count("TP1"),"12h_stop":o12.count("STOP")+o12.count("STOP_SAME_BAR_CONSERVATIVE"),
                  "12h_open":o12.count("OPEN"),
                  "12h_tp1_rate_pct":round(100*o12.count("TP1")/len(ms),1) if ms else None,
                  "12h_stop_rate_pct":round(100*(o12.count("STOP")+o12.count("STOP_SAME_BAR_CONSERVATIVE"))/len(ms),1) if ms else None,
              }

          holdout_end=now-24*3600
          summary={
              "generated_at_utc":datetime.fromtimestamp(now,timezone.utc).isoformat(),
              "active_markets":len(markets),
              "api_errors":len(client.errors),
              "spread_markets":len(spread_index),
              "duration_sec":round(time.time()-started,1),
              "holdout_72h":summarize_period(audit_start,holdout_end),
              "tuning_last24h":summarize_period(holdout_end,now),
              "full96h":summarize_period(audit_start,now),
              "windows":windows,
          }
          Path("/tmp/solaire_96h_walkforward.json").write_text(
              json.dumps({"summary":summary,"mails":mails,"detections":detections,
                          "market_stats":market_stats},indent=2),encoding="utf-8")
          print("WF96_SUMMARY="+json.dumps(summary,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solaire-96h-walkforward
          path: /tmp/solaire_96h_walkforward.json
          retention-days: 14
