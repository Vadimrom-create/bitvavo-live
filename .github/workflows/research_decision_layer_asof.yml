name: Research Decision Layer as-of comparison
on:
  pull_request:
    paths:
      - scripts/compare_direct_decision_shadow.py
      - scripts/audit_dl_cadence.py
      - scripts/compare_same_snapshot_v4_dl.py
      - scripts/research_dl_price_paths.py
      - scripts/research_direct_dl_outcomes.py
      - scripts/verify_dl_commit_asof.py
      - scripts/audit_dl_dispatches.py
      - tests/test_compare_direct_decision_shadow.py
      - tests/test_audit_dl_cadence.py
      - tests/test_compare_same_snapshot_v4_dl.py
      - tests/test_research_dl_price_paths.py
      - tests/test_research_direct_dl_outcomes.py
      - tests/test_verify_dl_commit_asof.py
      - tests/test_audit_dl_dispatches.py
      - docs/DECISION_LAYER_ASOF_COMPARISON_20261016.md
      - .github/workflows/research_decision_layer_asof.yml
permissions:
  contents: read
  actions: read
jobs:
  asof-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/compare_direct_decision_shadow.py
            scripts/audit_dl_cadence.py
            scripts/compare_same_snapshot_v4_dl.py
            scripts/research_dl_price_paths.py
            scripts/research_direct_dl_outcomes.py
            scripts/verify_dl_commit_asof.py
            scripts/audit_dl_dispatches.py
            research/common.py
            research/http.py
            research/production_journal.py
            research/__init__.py
            research/decision_layer.py
            history/2026-10-15
            tests/test_compare_direct_decision_shadow.py
            tests/test_audit_dl_cadence.py
            tests/test_compare_same_snapshot_v4_dl.py
            tests/test_research_dl_price_paths.py
            tests/test_research_direct_dl_outcomes.py
            tests/test_verify_dl_commit_asof.py
            tests/test_audit_dl_dispatches.py
            production_direct_decision_journal.json
            decision_history
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline causal join regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Align retained public production decisions with historical DL states
        run: python scripts/compare_direct_decision_shadow.py --max-age-seconds 3600 --output /tmp/dl-asof-evidence.json
      - name: Check Git commit timestamps of matched DL archive files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_dl_commit_asof.py --asof-json /tmp/dl-asof-evidence.json --max-age-seconds 900 --output /tmp/dl-commit-asof-evidence.json
      - name: Count actual recorded V4-DL scheduled workflow runs by historical UTC date
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_dl_dispatches.py --days 2026-10-02 2026-10-03 2026-10-04 2026-10-14 2026-10-15 --output /tmp/dl-github-dispatch.json
      - name: Quantify DL cadence and freshness sensitivity
        run: python scripts/audit_dl_cadence.py --full-day-utc 2026-10-14 --compare-periods 2026-09-10 2026-10-02 2026-10-04 2026-10-15 --output /tmp/dl-cadence-evidence.json
      - name: Compare same-snapshot V4 acceleration proxy and Decision Layer
        run: python scripts/compare_same_snapshot_v4_dl.py --history-glob 'history/2026-10-15/*.json.gz' --output /tmp/v4-accel-dl-same-snapshot.json
      - name: Observe matured 24/48/72h reference paths on first V4 confirmed events
        run: python scripts/research_dl_price_paths.py --history-glob 'history/2026-10-15/*.json.gz' --max-per-horizon 8 --output /tmp/v4-dl-price-paths.json
      - name: Observe true DIRECT sent alerts vs previous shadow DL on mature public price paths
        run: python scripts/research_direct_dl_outcomes.py --max-per-horizon 5 --output /tmp/direct-dl-price-paths.json
      - uses: actions/upload-artifact@v4
        with:
          name: dl-asof-research-only
          path: |
            /tmp/dl-asof-evidence.json
            /tmp/dl-cadence-evidence.json
            /tmp/v4-accel-dl-same-snapshot.json
            /tmp/v4-dl-price-paths.json
            /tmp/direct-dl-price-paths.json
            /tmp/dl-commit-asof-evidence.json
            /tmp/dl-github-dispatch.json
          retention-days: 14
