name: Solaire episode grace audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/solaire_episode_grace_trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay episode gaps
        run: python scripts/audit_solaire_episode_grace.py
      - name: Persist episode grace audit
        run: |
          cp research/solaire_episode_grace_20260921.json /tmp/result.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/result.json research/solaire_episode_grace_20260921.json
            git add research/solaire_episode_grace_20260921.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Solaire episode grace audit"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
