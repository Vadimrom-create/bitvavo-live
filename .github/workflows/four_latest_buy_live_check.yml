name: Four latest BUY live check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/four_latest_buy_live_check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check latest BUYs
        run: |
          python - <<'PY'
          import json,time
          from research.http import PublicClient
          from research.common import finite
          from research.features import describe
          from research.risk import structural_plan
          c=PublicClient(timeout=12,retries=2,requests_per_second=6)
          now=time.time()
          metas={m["market"]:m for m in c.get("/markets")}
          tickers={x["market"]:x for x in c.get("/ticker/24h")}
          mails={
            "USELESS-EUR":{"entry":0.262362,"stop":0.239934,"tp":0.307217},
            "AVA-EUR":{"entry":0.24,"stop":0.22083,"tp":0.27834},
            "WIF-EUR":{"entry":0.22472,"stop":0.20827,"tp":0.25761},
            "LAPTOP-EUR":{"entry":0.0697,"stop":0.06562,"tp":0.07786},
          }
          def closed(market,interval,limit,dur_ms):
              raw=c.get("/"+market+"/candles",{"interval":interval,"limit":limit},cache=False)
              obs={}
              for r in raw:
                  if not isinstance(r,list) or len(r)<6: continue
                  vals=[finite(x) for x in r[:6]]
                  if any(v is None for v in vals): continue
                  t,o,h,l,cl,v=vals;t=int(t)
                  if t+dur_ms>now*1000: continue
                  obs[t]={"t":t,"o":o,"h":h,"l":l,"c":cl,"v":v,"bar_status":"CLOSED_TRADE"}
              if not obs:return []
              ks=sorted(obs);out=[];prev=None;x=ks[0]
              while x<=ks[-1]:
                  row=obs.get(x)
                  if row is not None:
                      prev=row["c"];out.append(row)
                  elif prev is not None:
                      out.append({"t":x,"o":prev,"h":prev,"l":prev,"c":prev,"v":0.0,"bar_status":"NO_TRADE"})
                  x+=dur_ms
              return out
          for market,m in mails.items():
              tk=tickers[market]
              book=c.get("/"+market+"/book",{"depth":25},cache=False)
              c5=closed(market,"5m",120,300000); c15=closed(market,"15m",120,900000)
              f5=describe(c5[-100:],"5m"); f15=describe(c15[-100:],"15m")
              bid=float(book["bids"][0][0]); ask=float(book["asks"][0][0])
              def depth(side,n=10): return sum(float(p)*float(q) for p,q in side[:n])
              bd=depth(book.get("bids",[])); ad=depth(book.get("asks",[]))
              last=float(tk["last"]); op=float(tk["open"])
              plan=structural_plan({"market":market,"ask":ask},f15,metas[market])
              print("LIVE="+json.dumps({
                "market":market,"last":last,"change24_pct":(last/op-1)*100,
                "bid":bid,"ask":ask,"spread_pct":(ask/bid-1)*100,
                "bid_depth":bd,"ask_depth":ad,"imbalance":(bd-ad)/(bd+ad) if bd+ad else None,
                "since_entry_pct":(last/m["entry"]-1)*100,
                "to_stop_pct":(last/m["stop"]-1)*100,
                "to_tp_pct":(m["tp"]/last-1)*100,
                "recent1h_low":min(x["l"] for x in c5[-12:]),"recent1h_high":max(x["h"] for x in c5[-12:]),
                "f5":f5,"f15":f15,"plan_now":plan
              },separators=(",",":")))
          PY
