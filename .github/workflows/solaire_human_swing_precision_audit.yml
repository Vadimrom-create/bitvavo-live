name: Solaire human swing precision audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_human_swing_precision.py'
      - '.github/workflows/solaire_human_swing_precision_audit.yml'

permissions:
  contents: write

concurrency:
  group: solaire-human-swing-precision-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            research
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile audit
        run: python -m py_compile scripts/audit_human_swing_precision.py

      - name: Run human swing precision audit
        run: python scripts/audit_human_swing_precision.py

      - name: Validate measurement-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/human_swing_precision_latest.json'))
          assert p['measurement_only'] is True
          assert p['affects_production'] is False
          assert p['markets_with_history'] > 300
          assert p['signal_episode_summary']['v4_watch']['168']['n'] > 100
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-swing-precision-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            research/human_swing_precision_latest.json
            research/human_swing_precision_latest.md

      - name: Persist audit report
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/human_swing_precision_latest.json research/human_swing_precision_latest.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update human swing precision audit'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
