name: Test private SCAN accountability sidecar
on:
  pull_request:
    paths:
      - "scripts/scan_accountability_ledger.py"
      - "tests/test_scan_accountability_ledger.py"
      - ".github/workflows/scan_accountability_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-accountability-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static compile
        run: python -m py_compile scripts/scan_accountability_ledger.py tests/test_scan_accountability_ledger.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_scan_accountability_ledger.py' -v
