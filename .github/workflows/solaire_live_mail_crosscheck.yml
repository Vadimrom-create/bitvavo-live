name: Solaire live-mail structural crosscheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solaire_live_mail_crosscheck.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct structure at actual Gmail BUY times
        run: |
          python - <<'PY'
          import bisect,json,time
          from datetime import datetime,timezone
          from research.common import finite,INTERVAL_MS
          from research.features import describe
          from research.http import PublicClient

          SAMPLES=[["DRIFT-EUR","2026-09-20T23:21:32+00:00",0.014135,0.013494,0.015416,9.13],["LUNA2-EUR","2026-09-20T23:23:20+00:00",0.050136,0.047273,0.055861,8.48],["KMNO-EUR","2026-09-20T23:47:24+00:00",0.028721,0.02748,0.031202,7.08],["STX-EUR","2026-09-21T00:00:30+00:00",0.29275,0.28147,0.31531,7.34],["SUI-EUR","2026-09-21T00:29:02+00:00",0.81961,0.76828,0.92226,8.17],["LDO-EUR","2026-09-21T00:51:17+00:00",0.38362,0.36472,0.42142,8.95],["MORPHO-EUR","2026-09-21T01:05:37+00:00",2.43888,2.33865,2.63934,6.67],["VVV-EUR","2026-09-21T01:24:10+00:00",27.0683,24.9591,31.2867,8.37],["XPL-EUR","2026-09-21T01:41:37+00:00",0.082007,0.077131,0.091758,7.06],["KMNO-EUR","2026-09-21T02:52:35+00:00",0.029925,0.02822,0.033335,7.44],["G-EUR","2026-09-21T03:29:52+00:00",0.0062212,0.0057262,0.0072111,7.07],["USELESS-EUR","2026-09-21T03:48:33+00:00",0.219354,0.20368,0.250702,9.21],["TAIKO-EUR","2026-09-21T04:01:31+00:00",0.0774,0.0736,0.08499,6.93],["AVAX-EUR","2026-09-21T04:43:16+00:00",10.027,9.5882,10.9045,7.73],["NIL-EUR","2026-09-21T05:36:50+00:00",0.057231,0.052465,0.066762,7.77],["ZAMA-EUR","2026-09-21T05:53:10+00:00",0.081842,0.074958,0.09561,7.77],["EGLD-EUR","2026-09-21T06:14:29+00:00",3.6903,3.5141,4.0427,7.57],["APT-EUR","2026-09-21T06:41:53+00:00",0.6695,0.6379,0.7326,8.2],["PHA-EUR","2026-09-21T07:23:29+00:00",0.036527,0.033484,0.042612,7.69]]
          client=PublicClient(timeout=15,retries=3,requests_per_second=8)
          client.get("/time",cache=False)
          now=time.time()

          by_market={}
          for market,*_ in SAMPLES:
              if market in by_market:continue
              r5=client.get("/"+market+"/candles",{"interval":"5m","limit":500},cache=False)
              r15=client.get("/"+market+"/candles",{"interval":"15m","limit":250},cache=False)
              by_market[market]=(r5,r15)

          def canonical(rows,interval):
              dur=INTERVAL_MS[interval];obs={}
              for r in rows:
                  if not isinstance(r,list) or len(r)<6:continue
                  vals=[finite(v) for v in r[:6]]
                  if any(v is None for v in vals):continue
                  t,o,h,l,c,v=vals;t=int(t)
                  if t+dur>now*1000 or t%dur or min(o,h,l,c)<=0 or v<0:continue
                  obs[t]={"t":t,"o":o,"h":h,"l":l,"c":c,"v":v,"bar_status":"CLOSED_TRADE"}
              if not obs:return []
              ks=sorted(obs);out=[];prev=None;t=ks[0]
              while t<=ks[-1]:
                  x=obs.get(t)
                  if x is not None:prev=x["c"];out.append(x)
                  elif prev is not None:out.append({"t":t,"o":prev,"h":prev,"l":prev,"c":prev,"v":0.0,"bar_status":"NO_TRADE"})
                  t+=dur
              return out

          series={m:(canonical(a,"5m"),canonical(b,"15m")) for m,(a,b) in by_market.items()}

          def feat_at(cs,interval,ts):
              dur=INTERVAL_MS[interval];starts=[x["t"] for x in cs]
              idx=bisect.bisect_right(starts,int(ts*1000)-dur)
              sub=cs[max(0,idx-100):idx]
              return describe(sub,interval) if sub else {"valid":False}

          def path_after(c5,ts,entry,stop,tp1):
              hi=entry;lo=entry;result="OPEN"
              for x in c5:
                  xt=x["t"]/1000
                  if xt<ts:continue
                  hi=max(hi,x["h"]);lo=min(lo,x["l"])
                  sh=x["l"]<=stop;th=x["h"]>=tp1
                  if sh:
                      result="STOP";break
                  if th:
                      result="TP1";break
              last=[x["c"] for x in c5 if x["t"]/1000>=ts]
              return {"result":result,"mfe_pct":(hi/entry-1)*100,"mae_pct":(lo/entry-1)*100,
                      "last_pct":(last[-1]/entry-1)*100 if last else None}

          rows=[]
          for market,iso,entry,stop,tp1,score in SAMPLES:
              ts=datetime.fromisoformat(iso).timestamp()
              c5,c15=series[market]
              f15=feat_at(c15,"15m",ts)
              f5=feat_at(c5,"5m",ts)
              path=path_after(c5,ts,entry,stop,tp1)
              rows.append({
                "market":market,"mail_utc":iso,"score":score,"entry":entry,
                "structural_range_15m_pct":f15.get("consolidation_range_pct"),
                "atr15_pct":f15.get("atr14_pct"),
                "return4_15m_pct":f15.get("return_4bar_pct"),
                "extension_ma20_15m_pct":f15.get("extension_ma20_pct"),
                "return4_5m_pct":f5.get("return_4bar_pct"),
                "relative_volume_5m":f5.get("relative_volume"),
                "would_pass_range6":finite(f15.get("consolidation_range_pct"),0)>=6.0,
                "path":path,
              })
          summary={
            "n":len(rows),
            "pass6":sum(r["would_pass_range6"] for r in rows),
            "blocked6":sum(not r["would_pass_range6"] for r in rows),
            "pass6_tp1":sum(r["would_pass_range6"] and r["path"]["result"]=="TP1" for r in rows),
            "pass6_stop":sum(r["would_pass_range6"] and r["path"]["result"]=="STOP" for r in rows),
            "blocked6_tp1":sum((not r["would_pass_range6"]) and r["path"]["result"]=="TP1" for r in rows),
            "blocked6_stop":sum((not r["would_pass_range6"]) and r["path"]["result"]=="STOP" for r in rows),
          }
          print("LIVE_MAIL_SUMMARY="+json.dumps(summary,separators=(",",":")))
          for r in rows:print("LIVE_MAIL_ROW="+json.dumps(r,separators=(",",":")))
          PY
