name: Solaire production stale-scan watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production_scan_watchdog.yml'
      - 'scripts/prospective_wakeup.py'
  # Secondary cold-start fallback only. Normal production cadence is chained
  # by workflow_dispatch from the heartbeat itself and does not depend on cron.
  schedule:
    - cron: '2-59/5 * * * *'
  # Workflow completion is a separate wake-up domain from cron. In particular,
  # a failed heartbeat can restart the heartbeat chain immediately.
  workflow_run:
    workflows:
      - 'Solaire direct Bitvavo scan heartbeat'
      - 'Bitvavo live data + frozen V4 + measurement + useful alerts'
      - 'Solaire direct Bitvavo scan'
      - 'Solaire prospective shadow measurements'
    types: [completed]

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'
  MAX_SCAN_AGE_SECONDS: '720'
  MAX_RECOVERY_REGISTRY_AGE_SECONDS: '900'

jobs:
  # Read-only prospective observer. It never participates in the production
  # publisher lock and cannot delay the heartbeat.
  prospective-wakeup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/prospective_wakeup.py
            research/common.py
            research/prospective_cadence.py
            prospective_collection_state.json
            prospective_collection_health.json
          sparse-checkout-cone-mode: false
      - name: Reevaluate prospective health and request one bounded wakeup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prospective_wakeup.py

  # First check is deliberately outside the production publisher lock.
  # A FRESH watchdog run must never queue ahead of a useful heartbeat.
  production-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.freshness.outputs.stale }}
      age_seconds: ${{ steps.freshness.outputs.age_seconds }}
      reason: ${{ steps.freshness.outputs.reason }}
      registry_stale: ${{ steps.freshness.outputs.registry_stale }}
      registry_age_seconds: ${{ steps.freshness.outputs.registry_age_seconds }}
      registry_reason: ${{ steps.freshness.outputs.registry_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            production_scan_status.json
            production_recovery_registry_status.json
          sparse-checkout-cone-mode: false

      - name: Observe production scan freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone

          def freshness(path, max_age):
              stale = True
              reason = "MISSING_STATUS"
              age = -1
              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      status = json.load(fh)
                  stamp = status.get("checked_at_utc") or status.get("signal_at_utc")
                  if not stamp:
                      reason = "MISSING_TIMESTAMP"
                  else:
                      dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                      age = max(0, int((datetime.now(timezone.utc) - dt).total_seconds()))
                      stale = age > max_age
                      reason = "STALE" if stale else "FRESH"
              except Exception as exc:
                  reason = f"STATUS_READ_ERROR_{type(exc).__name__}"
              return stale, age, reason

          stale, age, reason = freshness(
              "production_scan_status.json",
              int(os.environ["MAX_SCAN_AGE_SECONDS"]),
          )
          registry_stale, registry_age, registry_reason = freshness(
              "production_recovery_registry_status.json",
              int(os.environ["MAX_RECOVERY_REGISTRY_AGE_SECONDS"]),
          )

          print(f"stale={'true' if stale else 'false'}")
          print(f"age_seconds={age}")
          print(f"reason={reason}")
          print(f"registry_stale={'true' if registry_stale else 'false'}")
          print(f"registry_age_seconds={registry_age}")
          print(f"registry_reason={registry_reason}")
          PY

      - name: Report freshness observation
        run: |
          echo "Watchdog decision: ${{ steps.freshness.outputs.reason }}"
          echo "Last production scan age: ${{ steps.freshness.outputs.age_seconds }}s"
          echo "Rescue threshold: ${MAX_SCAN_AGE_SECONDS}s"
          echo "Recovery registry decision: ${{ steps.freshness.outputs.registry_reason }}"
          echo "Recovery registry age: ${{ steps.freshness.outputs.registry_age_seconds }}s"
          echo "Recovery registry threshold: ${MAX_RECOVERY_REGISTRY_AGE_SECONDS}s"

  # Restart the cadence chain if the last heartbeat itself failed, or whenever
  # any watchdog wake-up proves the scan is stale. This dispatch uses the
  # workflow_dispatch exception allowed for GITHUB_TOKEN, so it does not rely
  # on a new schedule event.
  restart-heartbeat-chain:
    needs: production-freshness
    if: >-
      always() &&
      (
        needs.production-freshness.outputs.stale == 'true' ||
        needs.production-freshness.outputs.registry_stale == 'true' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Solaire direct Bitvavo scan heartbeat' &&
          github.event.workflow_run.conclusion != 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch heartbeat if none is already active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active=0
          for status in queued in_progress; do
            count="$(
              gh api                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/production_scan_fast.yml/runs?status=${status}&per_page=50"                 --jq '[.workflow_runs[]] | length'
            )"
            active=$((active + count))
          done

          if [ "${active}" -gt 0 ]; then
            echo "Heartbeat already queued/in progress; restart not needed."
            exit 0
          fi

          gh api             --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/workflows/production_scan_fast.yml/dispatches"             -f ref=main

          echo "Heartbeat chain restarted through workflow_dispatch."

  # Only a genuinely stale observation is allowed to enter the exact heartbeat
  # publisher lock. A second freshness check happens after the lock is acquired:
  # if a heartbeat refreshed production while the rescue was queued, no scan,
  # email or publication is performed.
  rescue-if-stale:
    needs: production-freshness
    if: needs.production-freshness.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: bitvavo-production-heartbeat-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recheck freshness under publisher lock
        id: recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone

          path = "production_scan_status.json"
          max_age = int(os.environ["MAX_SCAN_AGE_SECONDS"])
          stale = True
          reason = "MISSING_STATUS"
          age = -1

          try:
              with open(path, "r", encoding="utf-8") as fh:
                  status = json.load(fh)
              stamp = status.get("checked_at_utc") or status.get("signal_at_utc")
              if not stamp:
                  reason = "MISSING_TIMESTAMP"
              else:
                  dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  age = max(0, int((datetime.now(timezone.utc) - dt).total_seconds()))
                  stale = age > max_age
                  reason = "STALE" if stale else "FRESH_AFTER_LOCK"
          except Exception as exc:
              reason = f"STATUS_READ_ERROR_{type(exc).__name__}"

          print(f"stale={'true' if stale else 'false'}")
          print(f"age_seconds={age}")
          print(f"reason={reason}")
          PY

      - name: Report locked freshness decision
        run: |
          echo "Locked watchdog decision: ${{ steps.recheck.outputs.reason }}"
          echo "Production scan age under lock: ${{ steps.recheck.outputs.age_seconds }}s"
          echo "Initial observer decision: ${{ needs.production-freshness.outputs.reason }}"
          echo "Initial observer age: ${{ needs.production-freshness.outputs.age_seconds }}s"

      - name: Run one rescue production scan
        if: steps.recheck.outputs.stale == 'true'
        env:
          ALERT_GMAIL_USER: ${{ vars.ALERT_GMAIL_USER }}
          ALERT_EMAIL_TO: bellonirom@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/production_scan.py
          python scripts/send_production_buy_alert.py

      - name: Persist rescued production state
        if: steps.recheck.outputs.stale == 'true'
        run: |
          set -euo pipefail
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'

          for file in             production_alert_candidates.json             production_scan_status.json             production_universe_snapshot.json             production_alert_state.json             production_alert_status.json             production_direct_decision_journal.json; do
            if [ -e "${file}" ]; then git add "${file}"; fi
          done

          if [ -d execution_observations ]; then git add execution_observations; fi

          if git diff --cached --quiet; then
            echo "Rescue scan produced no publishable changes."
            exit 0
          fi

          git commit -m 'Watchdog rescue stale production scan'

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Watchdog publication conflict; refusing stale publication." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Watchdog publication retries exhausted." >&2
          exit 1
