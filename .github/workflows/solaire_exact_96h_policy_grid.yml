name: Solaire exact 96h policy grid

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solaire_exact_96h_policy_grid.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact cycle-by-cycle Solaire replay
        run: |
          python - <<'PY'
          import bisect,gzip,json,re,time
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from datetime import datetime,timezone
          from pathlib import Path

          from research.common import finite,INTERVAL_MS
          from research.features import describe
          from research.http import PublicClient
          from research.production_acceleration import acceleration_signal
          from research.risk import structural_plan

          NOW=time.time(); START=NOW-96*3600
          MIN_QV=75000.0; THESIS_TTL=24*3600
          VARIANTS={
            "baseline":{"min_stop":0.0,"max_stop":10.0,"max_spread":.5,"min_score":6.5},
            "minstop4":{"min_stop":4.0,"max_stop":10.0,"max_spread":.5,"min_score":6.5},
            "minstop5":{"min_stop":5.0,"max_stop":10.0,"max_spread":.5,"min_score":6.5},
            "minstop6":{"min_stop":6.0,"max_stop":10.0,"max_spread":.5,"min_score":6.5},
            "minstop7":{"min_stop":7.0,"max_stop":10.0,"max_spread":.5,"min_score":6.5},
            "spread40":{"min_stop":0.0,"max_stop":10.0,"max_spread":.4,"min_score":6.5},
            "minstop6_spread40":{"min_stop":6.0,"max_stop":10.0,"max_spread":.4,"min_score":6.5},
            "score7":{"min_stop":0.0,"max_stop":10.0,"max_spread":.5,"min_score":7.0},
            "score75":{"min_stop":0.0,"max_stop":10.0,"max_spread":.5,"min_score":7.5}
          }

          client=PublicClient(timeout=18,retries=3,requests_per_second=12)
          client.get("/time",cache=False)
          markets=[m for m in client.get("/markets") if m.get("quote")=="EUR" and m.get("status")=="trading"]
          meta={m["market"]:m for m in markets}

          def fetch(m):
              try:
                  return m,client.get("/"+m+"/candles",{"interval":"5m","limit":1440},cache=False),client.get("/"+m+"/candles",{"interval":"15m","limit":500},cache=False),None
              except Exception as e:return m,[],[],type(e).__name__+":"+str(e)
          raw={}
          with ThreadPoolExecutor(max_workers=12) as ex:
              for f in as_completed([ex.submit(fetch,m["market"]) for m in markets]):
                  m,r5,r15,e=f.result();raw[m]=(r5,r15,e)

          def canon(rows,interval):
              dur=INTERVAL_MS[interval];obs={}
              for r in rows:
                  if not isinstance(r,list) or len(r)<6:continue
                  vals=[finite(v) for v in r[:6]]
                  if any(v is None for v in vals):continue
                  t,o,h,l,c,v=vals;t=int(t)
                  if t+dur>NOW*1000 or t%dur or min(o,h,l,c)<=0 or v<0:continue
                  obs[t]={"t":t,"o":o,"h":h,"l":l,"c":c,"v":v,"bar_status":"CLOSED_TRADE"}
              if not obs:return []
              ks=sorted(obs);out=[];prev=None;t=ks[0]
              while t<=ks[-1]:
                  x=obs.get(t)
                  if x is not None:prev=x["c"];out.append(x)
                  elif prev is not None:out.append({"t":t,"o":prev,"h":prev,"l":prev,"c":prev,"v":0.0,"bar_status":"NO_TRADE"})
                  t+=dur
              return out
          series={m:(canon(a,"5m"),canon(b,"15m")) for m,(a,b,e) in raw.items()}
          s5={m:[x["t"] for x in cs[0]] for m,cs in series.items()}
          s15={m:[x["t"] for x in cs[1]] for m,cs in series.items()}

          def feat(m,interval,ts):
              cs=series[m][0 if interval=="5m" else 1]; starts=s5[m] if interval=="5m" else s15[m]
              dur=INTERVAL_MS[interval];i=bisect.bisect_right(starts,int(ts*1000)-dur)
              if i<=0:return {"valid":False},None,i
              sub=cs[max(0,i-100):i]
              return describe(sub,interval),sub[-1]["c"],i
          def qv(m,i):
              cs=series[m][0];return sum(x["v"]*x["c"] for x in cs[max(0,i-288):i])

          spreads=defaultdict(list);rx=re.compile(r"(\d{8}T\d{6}Z)")
          def walk(o,ts):
              if isinstance(o,dict):
                  mk=o.get("market")
                  if mk in meta:
                      sp=finite(o.get("spread_pct"));bid=finite(o.get("bid"));ask=finite(o.get("ask"))
                      if sp is None and bid and ask and bid>0 and ask>=bid:sp=(ask/bid-1)*100
                      if sp is not None:spreads[mk].append((ts,sp,ask))
                  for v in o.values():walk(v,ts)
              elif isinstance(o,list):
                  for v in o:walk(v,ts)
          for folder in ["history/2026-09-16","history/2026-09-17","history/2026-09-18","history/2026-09-19","history/2026-09-20","history/2026-09-21"]:
              p=Path(folder)
              if not p.exists():continue
              for fp in p.glob("*.json.gz"):
                  mm=rx.search(fp.name)
                  if not mm:continue
                  ts=datetime.strptime(mm.group(1),"%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc).timestamp()
                  if ts<START-1800 or ts>NOW+60:continue
                  try:
                      with gzip.open(fp,"rt",encoding="utf-8") as h:walk(json.load(h),ts)
                  except Exception:pass
          spread_times={}
          for m in spreads:
              spreads[m].sort();spread_times[m]=[x[0] for x in spreads[m]]
          def spr(m,ts):
              xs=spreads.get(m,[]);tt=spread_times.get(m,[])
              if not xs:return None
              i=bisect.bisect_right(tt,ts)-1
              if i<0:return None
              st,sp,ask=xs[i]
              return {"spread":sp,"ask":ask,"age":ts-st} if ts-st<=1200 else None

          # precompute per-cycle observations
          cycles=sorted({x["t"]/1000+301 for m,(c5,c15) in series.items() for x in c5 if START<=x["t"]/1000+301<=NOW})
          obs=defaultdict(dict)
          for m,(c5,c15) in series.items():
              if not c5 or not c15:continue
              for x in c5:
                  ts=x["t"]/1000+301
                  if ts<START or ts>NOW:continue
                  f5,p,i=feat(m,"5m",ts);f15,_,_=feat(m,"15m",ts)
                  sig=acceleration_signal({"features":{"5m":f5,"15m":f15}})
                  obs[ts][m]={"market":m,"price":p,"idx":i,"f15":f15,"state":sig.get("state"),
                              "score":finite(sig.get("score"),0),"evidence":int(sig.get("evidence_count") or 0)}

          def outcome(m,mail,hours=12):
              end=mail["ts"]+hours*3600;entry=mail["entry"];stop=mail["stop"];tp1=mail["tp1"]
              hi=entry;lo=entry
              for x in series[m][0]:
                  xt=x["t"]/1000
                  if xt<mail["ts"] or xt>end:continue
                  hi=max(hi,x["h"]);lo=min(lo,x["l"])
                  sh=x["l"]<=stop;th=x["h"]>=tp1
                  if sh:return {"result":"STOP","mfe":(hi/entry-1)*100,"mae":(lo/entry-1)*100}
                  if th:return {"result":"TP1","mfe":(hi/entry-1)*100,"mae":(lo/entry-1)*100}
              return {"result":"OPEN","mfe":(hi/entry-1)*100,"mae":(lo/entry-1)*100}

          results={}
          for vname,cfg in VARIANTS.items():
              state=defaultdict(lambda:{"active":False,"episode":0,"handled":0})
              mails=[]
              for ts in cycles:
                  # update episodes and build currently actionable events
                  events=[]
                  for m,row in obs.get(ts,{}).items():
                      st=state[m]
                      tracked=row["state"] in ("BUILDING_ACCELERATION","CONFIRMED_ACCELERATION")
                      if not tracked:
                          st["active"]=False
                          continue
                      if not st["active"]:
                          st["active"]=True;st["episode"]+=1;st["start_ts"]=ts;st["start_price"]=row["price"]
                      if row["state"]!="CONFIRMED_ACCELERATION" or row["score"]<cfg["min_score"] or row["evidence"]<3:
                          continue
                      if st["episode"]==st["handled"]:continue
                      events.append({**row,"episode":st["episode"],"episode_age":ts-st["start_ts"],
                                     "episode_ext":(row["price"]/st["start_price"]-1)*100 if st["start_price"] else 0})
                  events.sort(key=lambda r:(max(0,r["episode_ext"]),r["episode_age"],-r["score"],-qv(r["market"],r["idx"])))

                  # production can suppress several prior-thesis events, but sends at most one email
                  for row in events:
                      m=row["market"];st=state[m]
                      th=st.get("thesis")
                      if th:
                          expired=ts-th["sent_ts"]>THESIS_TTL
                          lows=[x["l"] for x in series[m][0] if th["sent_ts"]*1000<=x["t"]<ts*1000] if not expired else []
                          breached=bool(lows) and min(lows)<=th["stop"]
                          if not expired and not breached:
                              st["handled"]=st["episode"];continue
                          st["thesis"]=None

                      qq=qv(m,row["idx"])
                      if qq<MIN_QV:continue
                      ss=spr(m,ts)
                      if ss is None or ss["spread"]>cfg["max_spread"]:continue
                      ask=ss["ask"] if ss.get("ask") else row["price"]
                      plan=structural_plan({"market":m,"ask":ask},row["f15"],meta[m])
                      if not plan.get("valid"):continue
                      sd=finite(plan.get("stop_distance_pct"),999)
                      # Unlike prior replay, stop-width rejection remains retryable within episode.
                      if sd>cfg["max_stop"] or sd<cfg["min_stop"]:continue
                      mail={"market":m,"ts":ts,"score":row["score"],"episode_ext":row["episode_ext"],
                            "episode_age_min":row["episode_age"]/60,"spread":ss["spread"],"qv":qq,
                            "stop_distance_pct":sd,"entry":plan["entry_eur"],"stop":plan["stop_eur"],"tp1":plan["tp1_eur"]}
                      mail["o4"]=outcome(m,mail,4);mail["o12"]=outcome(m,mail,12)
                      mails.append(mail)
                      st["handled"]=st["episode"];st["thesis"]={"sent_ts":ts,"stop":plan["stop_eur"]}
                      break

              def summ(a,b):
                  xs=[x for x in mails if a<=x["ts"]<b];o=[x["o12"]["result"] for x in xs]
                  return {"mails":len(xs),"markets":len(set(x["market"] for x in xs)),
                          "tp1":o.count("TP1"),"stop":o.count("STOP"),"open":o.count("OPEN"),
                          "tp1_rate":round(100*o.count("TP1")/len(xs),1) if xs else None,
                          "stop_rate":round(100*o.count("STOP")/len(xs),1) if xs else None,
                          "mfe4_ge5":sum(x["o4"]["mfe"]>=5 for x in xs),
                          "mfe4_ge5_rate":round(100*sum(x["o4"]["mfe"]>=5 for x in xs)/len(xs),1) if xs else None}
              days=[]
              for k in range(4):
                  a=START+k*86400;b=a+86400;days.append(summ(a,b))
              results[vname]={"full":summ(START,NOW),"holdout72":summ(START,NOW-86400),"last24":summ(NOW-86400,NOW),"days":days,"mails":mails}

          compact={k:{kk:vv for kk,vv in v.items() if kk!="mails"} for k,v in results.items()}
          print("EXACT_GRID="+json.dumps(compact,separators=(",",":")))
          Path("/tmp/solaire_exact_96h_policy_grid.json").write_text(json.dumps(results,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solaire-exact-96h-policy-grid
          path: /tmp/solaire_exact_96h_policy_grid.json
          retention-days: 14
