name: Swing Selector Clean OOS

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate_swing_selector_oos.py'
      - '.github/workflows/swing_selector_oos.yml'

permissions:
  contents: write

concurrency:
  group: swing-selector-clean-oos
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research
            scripts
            swing_history
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile scripts/evaluate_swing_selector_oos.py

      - name: Evaluate clean forward OOS
        run: python scripts/evaluate_swing_selector_oos.py

      - name: Validate measurement-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/swing_selector_oos_latest.json'))
          assert p['measurement_only'] is True
          assert p['clean_out_of_sample'] is True
          assert p['version'].startswith('SWING_SELECTOR_V1_FROZEN_2026-10-08_R2')
          PY

      - name: Upload OOS report
        uses: actions/upload-artifact@v4
        with:
          name: swing-selector-clean-oos-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            research/swing_selector_oos_latest.json
            research/swing_selector_oos_latest.md

      - name: Persist OOS report
        run: |
          set -euo pipefail
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/swing_selector_oos_latest.json research/swing_selector_oos_latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update clean swing OOS report'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
