name: Oracle on-demand public probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'oracle_probe_request.json'
      - 'scripts/oracle_probe_request.py'
      - '.github/workflows/oracle_request.yml'

permissions:
  contents: write

concurrency:
  group: oracle-on-demand-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch requested Oracle public probe
        run: python scripts/oracle_probe_request.py
      - name: Publish requested probe
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add oracle_requested_probe.json

          if git diff --cached --quiet; then
            echo 'No probe change to publish.'
            exit 0
          fi

          git commit -m 'Record requested Oracle public probe'

          # main is written by several independent workflows. A push can lose
          # the race even after a successful rebase, so refetch/rebase/retry.
          for attempt in 1 2 3 4 5 6; do
            echo "Publish attempt ${attempt}/6"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict while publishing oracle_requested_probe.json' >&2
              exit 1
            fi

            if git push origin HEAD:main; then
              echo 'Probe published successfully.'
              exit 0
            fi

            if [ "${attempt}" -lt 6 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo 'Failed to publish probe after 6 attempts.' >&2
          exit 1
