name: Solaire private wallet heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/send_useful_alert.py'
      - '.github/workflows/private_wallet_refresh.yml'
  # Cold-start fallback only. Normal cadence is self-chained through
  # workflow_dispatch, so missed GitHub schedule events cannot stale WALLET.
  schedule:
    - cron: '9 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: bitvavo-private-wallet-heartbeat-v1
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  MAX_PRODUCTION_SCAN_AGE_SECONDS: '480'

jobs:
  refresh-private-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record cycle start
        run: echo "WALLET_CYCLE_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install monitoring dependencies
        run: python -m pip install -r requirements-monitoring.txt

      - name: Build read-only private wallet summary
        env:
          BITVAVO_READ_API_KEY: ${{ secrets.BITVAVO_READ_API_KEY }}
          BITVAVO_READ_API_SECRET: ${{ secrets.BITVAVO_READ_API_SECRET }}
          POSITION_STATE_KEY: ${{ secrets.POSITION_STATE_KEY }}
          WALLET_SUMMARY_ONLY: 'true'
          ALLOW_BUY_ALERTS: 'false'
        run: python scripts/send_useful_alert.py

      - name: Verify private wallet artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('wallet_private_summary.json')
          if not path.exists():
              raise SystemExit('wallet_private_summary.json missing')

          payload = json.loads(path.read_text())
          required = {'generated_at_utc', 'cash_eur', 'positions_value_eur', 'wallet_value_eur', 'positions'}
          missing = sorted(required - payload.keys())
          if missing:
              raise SystemExit(f'missing wallet fields: {missing}')
          if not isinstance(payload['positions'], list):
              raise SystemExit('positions must be a list')
          print(
              'PRIVATE_WALLET_OK',
              payload['generated_at_utc'],
              payload['wallet_value_eur'],
              [row.get('market') for row in payload['positions']],
          )
          PY

      - name: Upload private wallet summary
        uses: actions/upload-artifact@v4
        with:
          name: private-wallet-summary-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: wallet_private_summary.json

      - name: Observe production scan freshness
        id: production_freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git show origin/main:production_scan_status.json > /tmp/production_scan_status.json; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "age_seconds=-1" >> "$GITHUB_OUTPUT"
            echo "reason=MISSING_STATUS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timezone

          with open('/tmp/production_scan_status.json', 'r', encoding='utf-8') as fh:
              status = json.load(fh)

          stamp = status.get('checked_at_utc') or status.get('signal_at_utc')
          max_age = int(os.environ['MAX_PRODUCTION_SCAN_AGE_SECONDS'])
          if not stamp:
              print('stale=true')
              print('age_seconds=-1')
              print('reason=MISSING_TIMESTAMP')
          else:
              dt = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
              age = max(0, int((datetime.now(timezone.utc) - dt).total_seconds()))
              print(f"stale={'true' if age > max_age else 'false'}")
              print(f'age_seconds={age}')
              print(f"reason={'STALE' if age > max_age else 'FRESH'}")
          PY

      - name: Recover stale production heartbeat
        if: steps.production_freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Production scan stale: age=${{ steps.production_freshness.outputs.age_seconds }}s reason=${{ steps.production_freshness.outputs.reason }}"

          now="$(date +%s)"
          recent_active=0

          for status in queued in_progress; do
            while IFS=      - name: Preserve five-minute cadence
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - WALLET_CYCLE_STARTED ))
          sleep_for=$(( 300 - elapsed ))
          if [ "${sleep_for}" -gt 0 ]; then
            echo "Sleeping ${sleep_for}s before handoff."
            sleep "${sleep_for}"
          else
            echo "Wallet refresh exceeded five minutes; handing off immediately."
          fi

      - name: Hand off to next private wallet refresh
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active=0
          for status in queued in_progress; do
            count="$(
              gh api                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/private_wallet_refresh.yml/runs?status=${status}&per_page=50"                 --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length"
            )"
            active=$((active + count))
          done

          if [ "${active}" -gt 0 ]; then
            echo "Another private wallet refresh is already queued/in progress; no duplicate handoff."
            exit 0
          fi

          if [ "${{ job.status }}" != "success" ]; then
            echo "Private wallet job ended with status ${{ job.status }}; delaying recovery handoff."
            sleep 300
          fi

          gh api             --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/workflows/private_wallet_refresh.yml/dispatches"             -f ref=main

          echo "Next private wallet refresh dispatched."
\t' read -r run_id created_at; do
              [ -n "${run_id}" ] || continue
              created_epoch="$(date -u -d "${created_at}" +%s)"
              run_age=$(( now - created_epoch ))

              if [ "${run_age}" -lt "${MAX_PRODUCTION_SCAN_AGE_SECONDS}" ]; then
                echo "Recent heartbeat ${run_id} is ${status} (${run_age}s); giving it time to publish."
                recent_active=1
                continue
              fi

              echo "Cancelling stale ${status} heartbeat ${run_id} (${run_age}s old)."
              gh api                 --method POST                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            done < <(
              gh api                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/production_scan_fast.yml/runs?status=${status}&per_page=50"                 --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
            )
          done

          if [ "${recent_active}" -gt 0 ]; then
            echo "A recent production heartbeat is already active; no duplicate recovery dispatch."
            exit 0
          fi

          sleep 2
          gh api             --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/workflows/production_scan_fast.yml/dispatches"             -f ref=main

          echo "Stale production heartbeat recovery dispatched from private wallet domain."

      - name: Preserve five-minute cadence
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - WALLET_CYCLE_STARTED ))
          sleep_for=$(( 300 - elapsed ))
          if [ "${sleep_for}" -gt 0 ]; then
            echo "Sleeping ${sleep_for}s before handoff."
            sleep "${sleep_for}"
          else
            echo "Wallet refresh exceeded five minutes; handing off immediately."
          fi

      - name: Hand off to next private wallet refresh
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active=0
          for status in queued in_progress; do
            count="$(
              gh api                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/private_wallet_refresh.yml/runs?status=${status}&per_page=50"                 --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length"
            )"
            active=$((active + count))
          done

          if [ "${active}" -gt 0 ]; then
            echo "Another private wallet refresh is already queued/in progress; no duplicate handoff."
            exit 0
          fi

          gh api             --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/workflows/private_wallet_refresh.yml/dispatches"             -f ref=main

          echo "Next private wallet refresh dispatched."
