name: Solaire prospective shadow measurements

on:
  workflow_dispatch:
    inputs:
      wakeup_source_run:
        description: 'Independent watchdog root run (empty for manual dispatch)'
        required: false
      wakeup_source_event:
        description: 'Independent root event; provenance only'
        required: false
  # Independent opportunities to notice a missing cron, without a dispatch loop.
  workflow_run:
    workflows:
      - 'Solaire direct Bitvavo scan heartbeat'
      - 'Solaire direct Bitvavo scan'
      - 'Bitvavo live data + frozen V4 + measurement + useful alerts'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/solaire_v3_shadow.py'
      - 'scripts/update_solaire_v3_evaluation.py'
      - 'research/solaire_v3.py'
      - 'scripts/solaire_v31_shadow.py'
      - 'scripts/update_solaire_v31_evaluation.py'
      - 'research/solaire_v31.py'
      - 'scripts/solaire_funnel_audit.py'
      - 'scripts/capture_funnel_prices.py'
      - 'scripts/prepare_v3_universe.py'
      - 'scripts/prospective_cycle.py'
      - 'scripts/persist_prospective_reservation.sh'
      - 'research/prospective_cadence.py'
      - 'research/prospective_control.py'
      - 'scripts/capture_phase_c_books.py'
      - 'research/execution_observability.py'
      - 'research/solaire_funnel_audit.py'
      - 'scripts/solaire_policy_challengers.py'
      - 'scripts/update_solaire_policy_challengers_evaluation.py'
      - '.github/workflows/solaire_prospective_shadows.yml'
  # Prospective measurements can exceed 12 minutes; run every 30 minutes
  # to avoid a permanent queue while keeping them independent from production.
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write

concurrency:
  group: solaire-prospective-shadow-measurements
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'

jobs:
  prospective-shadows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture causal input revision
        run: |
          echo "SOLAIRE_INPUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Causal input revision: $(git rev-parse HEAD)"

      - name: Check collection window and report missed slots
        id: cadence
        run: python scripts/prospective_cycle.py begin

      - name: Publish reservation and health before collection
        id: reservation
        run: bash scripts/persist_prospective_reservation.sh

      - name: Publish collection start under the reserved slot
        id: collection_start
        if: steps.cadence.outputs.collect == 'true'
        run: |
          python scripts/prospective_cycle.py start
          bash scripts/persist_prospective_reservation.sh

      - name: Capture actual input revision after reservation publication
        run: echo "SOLAIRE_INPUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare fresh neutral inputs without publishing production state
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/prepare_v3_universe.py

      - name: Run Solaire V3 prospective shadow
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        env:
          SOLAIRE_C0_CONTROL_PATH: runtime/prospective_inputs/c0_control.json
          SOLAIRE_C0_MANIFEST_PATH: runtime/prospective_inputs/c0_manifest.json
          SOLAIRE_V3_UNIVERSE_PATH: runtime/prospective_inputs/v3_universe.json
        run: python scripts/solaire_v3_shadow.py

      - name: Run Solaire V3.1 economic challenger shadow
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        env:
          SOLAIRE_V3_UNIVERSE_PATH: runtime/prospective_inputs/v3_universe.json
        run: python scripts/solaire_v31_shadow.py

      - name: Run Solaire policy challenger shadows
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        env:
          SOLAIRE_V3_UNIVERSE_PATH: runtime/prospective_inputs/v3_universe.json
        run: python scripts/solaire_policy_challengers.py

      - name: Capture Phase C execution costs independently from BUY validation
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/capture_phase_c_books.py

      - name: Capture fresh Bitvavo prices for funnel measurements
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/capture_funnel_prices.py

      - name: Run Solaire full-funnel measurement audit
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        env:
          SOLAIRE_FUNNEL_PRICE_PATH: runtime/prospective_inputs/funnel_prices.json
        run: python scripts/solaire_funnel_audit.py

      - name: Update Solaire V3 prospective evaluation
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/update_solaire_v3_evaluation.py

      - name: Update Solaire V3.1 prospective evaluation
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/update_solaire_v31_evaluation.py

      - name: Update Solaire policy challenger evaluation
        if: steps.cadence.outputs.collect == 'true'
        continue-on-error: true
        run: python scripts/update_solaire_policy_challengers_evaluation.py

      - name: Record actual cycle coverage
        if: always() && steps.collection_start.outcome == 'success' && steps.cadence.outputs.collect == 'true'
        run: python scripts/prospective_cycle.py finish

      - name: Persist prospective shadow state
        if: always() && steps.reservation.outcome == 'success'
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          for file in \
            solaire_v3_state.json \
            solaire_v3_journal.json \
            solaire_v3_status.json \
            solaire_v3_candidates.json \
            solaire_v3_theses.json \
            solaire_v3_rotation_state.json \
            solaire_v2_frozen_benchmark_journal.json \
            solaire_v2_reference_outcomes.json \
            solaire_v3_evaluation_status.json \
            solaire_v3_comparison.json \
            solaire_v31_state.json \
            solaire_v31_journal.json \
            solaire_v31_status.json \
            solaire_v31_candidates.json \
            solaire_v31_portfolio.json \
            solaire_v31_portfolio_persist30.json \
            solaire_v31_portfolio_pullback_reclaim.json \
            solaire_v31_portfolio_raw.json \
            solaire_v31_portfolio_reentry.json \
            solaire_v31_evaluation_status.json \
            solaire_v31_comparison.json \
            solaire_funnel_audit_state.json \
            solaire_funnel_audit_journal.json \
            solaire_funnel_audit_report.json \
            solaire_funnel_audit_status.json \
            solaire_policy_challengers_journal.json \
            solaire_policy_challengers_portfolios.json \
            solaire_policy_challengers_status.json \
            solaire_policy_challengers_comparison.json \
            solaire_policy_challengers_evaluation_status.json; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if [ -d execution_observations ]; then git add execution_observations; fi
          if [ -d prospective_cycle_receipts ]; then git add prospective_cycle_receipts; fi
          if [ -d prospective_controls ]; then git add prospective_controls; fi
          for file in prospective_collection_state.json prospective_collection_health.json; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          for file in phase_c_observation_state.json phase_c_observation_status.json; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist prospective shadows from input ${SOLAIRE_INPUT_SHA}"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Preserve prospective input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: runtime/prospective_inputs/
          if-no-files-found: ignore
