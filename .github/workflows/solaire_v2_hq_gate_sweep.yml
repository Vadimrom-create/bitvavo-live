name: Solaire HQ gate sweep
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/solaire_v2_hq_gate_sweep_trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sweep HQ BUILDING structure and RR gates
        run: python scripts/audit_solaire_v2_hq_gate_sweep.py
      - name: Persist gate sweep
        run: |
          cp research/solaire_v2_hq_gate_sweep_20260921.json /tmp/solaire_v2_hq_gate_sweep_20260921.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/solaire_v2_hq_gate_sweep_20260921.json research/solaire_v2_hq_gate_sweep_20260921.json
            git add research/solaire_v2_hq_gate_sweep_20260921.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record HQ BUILDING gate sweep"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
