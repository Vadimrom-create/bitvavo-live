name: Oracle enriched public probe shadow
# Post-reboot checks may be triggered by a harmless workflow touch.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/oracle_probe_snapshot.py'
      - '.github/workflows/oracle_shadow.yml'

permissions:
  contents: write

concurrency:
  group: oracle-public-probe-shadow
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch enriched Oracle public probes
        run: python scripts/oracle_probe_snapshot.py
      - name: Publish sanitized shadow snapshot
        continue-on-error: true
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add oracle_live_probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Oracle enriched public probe shadow'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict while publishing oracle_live_probe.json; snapshot remains local to this run.' >&2
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 6 ]; then
              sleep $((attempt * 2))
            fi
          done
          echo 'Failed to publish Oracle shadow after 6 attempts; do not fail monitoring workflow.' >&2
          exit 0
