name: Solaire human swing audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_human_swing.py'
      - '.github/workflows/solaire_human_swing_audit.yml'

permissions:
  contents: write

concurrency:
  group: solaire-human-swing-audit-v1
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            research
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile audit
        run: python -m py_compile scripts/audit_human_swing.py

      - name: Run full-universe human swing audit
        run: python scripts/audit_human_swing.py

      - name: Validate measurement-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/human_swing_audit_latest.json'))
          assert p['measurement_only'] is True, p
          assert p['affects_detection'] is False, p
          assert p['affects_buy_gate'] is False, p
          assert p['affects_email'] is False, p
          assert p['affects_orders'] is False, p
          assert p['active_eur_markets'] > 300, p
          assert p['threshold_counts']['30']['measured'] > 300, p
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-swing-audit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            research/human_swing_audit_latest.json
            research/human_swing_audit_latest.md

      - name: Persist audit report
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/human_swing_audit_latest.json research/human_swing_audit_latest.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged."
            exit 0
          fi
          git commit -m 'Update human swing audit'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Human swing audit rebase conflict." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Human swing audit publication retries exhausted." >&2
          exit 1
