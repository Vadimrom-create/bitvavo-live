name: V4 baseline and V5 infrastructure checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['**.py', 'tests/**', '.github/workflows/**', 'baseline/**', 'oracle/**', 'railway.toml', 'requirements-monitoring.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  DRY_RUN: 'true'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitoring.txt
      - run: python -m unittest discover -s tests -v
        name: Critical tests
      - name: Validate live probe and production sources
        run: |
          python -m py_compile oracle/bitvavo_public_probe.py scripts/oracle_probe_snapshot.py scripts/oracle_probe_request.py
          python -m py_compile research/production_gate.py scripts/production_scan.py scripts/send_production_buy_alert.py
          bash -n oracle/install_bitvavo_public_probe.sh oracle/bootstrap_oracle_deploy.sh
          grep -q 'healthcheckPath = "/health"' railway.toml
          grep -q 'restartPolicyType = "ALWAYS"' railway.toml
          grep -q 'startCommand = "python oracle/bitvavo_public_probe.py"' railway.toml
  public-live-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live scan, no email or real order
        run: python pipeline.py
      - name: Replay and compare with frozen V4
        run: python -m research.replay runtime/replay-*.json.gz
      - name: Keep review validation ephemeral
        run: |
          echo "Review-branch live validation is preserved only as an artifact."
          echo "CI must not mutate or rebase the branch it is validating."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-live-validation
          retention-days: 30
          path: |
            v5_report.json
            v5_report.md
            pipeline_health.json
            evaluation.json
            history/
            runtime/replay-*.json.gz
