name: Solaire direct production checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['**.py', 'tests/**', '.github/workflows/**', 'baseline/**', 'oracle/**', 'railway.toml', 'requirements-monitoring.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  DRY_RUN: 'true'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitoring.txt
      - run: python -m unittest discover -s tests -v
        name: Critical tests
      - name: Validate direct Solaire production sources
        run: |
          python -m py_compile research/production_gate.py research/production_acceleration.py research/production_alerts.py research/production_context.py research/solaire_v3.py research/features.py research/risk.py
          python -m py_compile scripts/production_scan.py scripts/send_production_buy_alert.py scripts/solaire_v3_shadow.py scripts/update_solaire_v3_evaluation.py scripts/update_early_building_shadow.py scripts/update_v21_range5_shadow.py scripts/update_rejection_shadow.py scripts/check_production_health.py
          python - <<'PY'
          import pathlib
          text = pathlib.Path('scripts/production_scan.py').read_text()
          assert 'oracle_required' in text
          assert 'hosted_probe_required' in text
          PY
      - name: Legacy Oracle and Railway syntax checks
        continue-on-error: true
        run: |
          python -m py_compile oracle/bitvavo_public_probe.py scripts/oracle_probe_snapshot.py scripts/oracle_probe_request.py
          bash -n oracle/install_bitvavo_public_probe.sh oracle/bootstrap_oracle_deploy.sh
          grep -q 'healthcheckPath = "/health"' railway.toml
          grep -q 'restartPolicyType = "ALWAYS"' railway.toml
          grep -q 'startCommand = "python oracle/bitvavo_public_probe.py"' railway.toml
  public-live-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Direct production live scan, no email
        run: python scripts/production_scan.py
      - name: Validate direct production scan output
        run: |
          python - <<'PY'
          import json
          status = json.load(open('production_scan_status.json'))
          assert status['status'] == 'OK', status
          assert status['active_eur_markets'] >= 300, status
          assert status['markets_collected'] == status['active_eur_markets'], status
          assert status['quality_ok'] >= int(status['active_eur_markets'] * 0.95), status
          payload = json.load(open('production_alert_candidates.json'))
          assert payload['oracle_required'] is False
          assert payload['hosted_probe_required'] is False
          universe = json.load(open('production_universe_snapshot.json'))
          assert len(universe['rows']) == status['active_eur_markets'], (len(universe['rows']), status)
          assert universe['affects_v2'] is False
          PY
      - name: Run Solaire V3 live prospective shadow, no email or order
        run: |
          python scripts/solaire_v3_shadow.py
          python scripts/update_solaire_v3_evaluation.py
          python - <<'PY'
          import json
          v3 = json.load(open('solaire_v3_status.json'))
          assert v3['mode'] == 'PROSPECTIVE_SHADOW', v3
          assert v3['affects_v2'] is False, v3
          assert v3['affects_email'] is False, v3
          assert v3['orders_submitted'] is False, v3
          comp = json.load(open('solaire_v3_comparison.json'))
          assert comp['frozen_v2_commit'] == '34b042121bb8425b0e4b46e3d1a694d4b1f4ec75', comp
          assert 'v3_timing_persist_30m' in comp['summary'], comp
          assert 'v3_timing_pullback_reclaim' in comp['summary'], comp
          assert v3['affects_email'] is False and v3['orders_submitted'] is False, v3
          PY
      - name: Research live scan, no email or real order
        continue-on-error: true
        run: python pipeline.py
      - name: Replay and compare with frozen V4
        continue-on-error: true
        run: python -m research.replay runtime/replay-*.json.gz
      - name: Keep review validation ephemeral
        run: |
          echo "Review-branch live validation is preserved only as an artifact."
          echo "CI must not mutate or rebase the branch it is validating."
      - name: Upload review validation artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: public-live-validation
          retention-days: 30
          path: |
            production_scan_status.json
            production_alert_candidates.json
            production_universe_snapshot.json
            solaire_v3_status.json
            solaire_v3_candidates.json
            solaire_v3_journal.json
            solaire_v3_rotation_state.json
            solaire_v3_evaluation_status.json
            solaire_v3_comparison.json
            solaire_v2_frozen_benchmark_journal.json
            solaire_v2_reference_outcomes.json
            v5_report.json
            v5_report.md
            pipeline_health.json
            evaluation.json
            history/
            runtime/replay-*.json.gz
