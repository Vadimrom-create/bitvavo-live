name: V4 baseline and V5 infrastructure checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['**.py', 'tests/**', '.github/workflows/**', 'baseline/**', 'requirements-monitoring.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  DRY_RUN: 'true'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitoring.txt
      - run: python -m unittest discover -s tests -v
        name: Critical tests
  public-live-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live scan, no email or real order
        run: python pipeline.py
      - name: Replay and compare with frozen V4
        run: python -m research.replay runtime/replay-*.json.gz
      - name: Preserve validated public observations on this review branch
        run: |
          git config user.name 'bitvavo-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v5_report.json v5_report.md pipeline_health.json evaluation.json history/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record public live validation and immutable observation journal'
          for attempt in 1 2 3 4; do
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort || true
              echo 'Concurrent review-branch conflict while publishing validation.' >&2
              exit 1
            fi
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 4 ]; then
              sleep $((attempt * 2))
            fi
          done
          echo 'Validation publication retries exhausted.' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-live-validation
          retention-days: 30
          path: |
            v5_report.json
            v5_report.md
            pipeline_health.json
            evaluation.json
            history/
            runtime/replay-*.json.gz
