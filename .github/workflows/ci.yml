name: V4 baseline and V5 infrastructure checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['**.py', 'tests/**', '.github/workflows/**', 'baseline/**', 'requirements-monitoring.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  DRY_RUN: 'true'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        suite: [monitoring, data, shadow, executor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-monitoring.txt
      - if: matrix.suite == 'executor'
        run: python -m pip install -r executor/requirements.txt
      - run: python scripts/run_tests.py ${{ matrix.suite }}
        name: Critical tests
  public-live-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live scan, no email or real order
        run: python scripts/audit_api_capacity.py
      - name: Replay and compare with frozen V4
        run: python -m research.replay runtime/replay-*.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-live-validation
          retention-days: 30
          path: |
            v5_report.json
            v5_report.md
            pipeline_health.json
            universe_surveillance.json
            history_corrected/
            runtime/replay-*.json.gz
            runtime/capacity-audit.json.gz
