name: ICX executability timeline
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/icx_executability_timeline_trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct ICX detector and execution timeline
        run: python scripts/audit_icx_executability_timeline.py
      - name: Persist ICX timeline
        run: |
          cp research/icx_executability_timeline_20260921.json /tmp/result.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/result.json research/icx_executability_timeline_20260921.json
            git add research/icx_executability_timeline_20260921.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record ICX executability timeline"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
