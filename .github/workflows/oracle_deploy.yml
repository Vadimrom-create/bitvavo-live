name: Legacy Oracle deploy (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate deployable Python
        id: validation
        continue-on-error: true
        run: python -m py_compile oracle/bitvavo_public_probe.py

      - name: Configure restricted SSH
        id: ssh_setup
        if: steps.validation.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/oracle_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/oracle_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy exact main commit with rollback healthcheck
        if: steps.validation.outcome == 'success' && steps.ssh_setup.outcome == 'success'
        run: |
          ssh -i "$HOME/.ssh/oracle_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            bitvavo-deploy@144.24.206.128 "deploy $GITHUB_SHA"

      - name: Verify health after deployment
        if: steps.validation.outcome == 'success' && steps.ssh_setup.outcome == 'success'
        run: |
          ssh -i "$HOME/.ssh/oracle_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            bitvavo-deploy@144.24.206.128 health


      - name: Report deployment channel not bootstrapped
        if: steps.validation.outcome == 'success' && steps.ssh_setup.outcome != 'success'
        run: |
          echo "::warning::Oracle deployment skipped: restricted SSH secrets are not configured yet."
          echo "ORACLE_DEPLOY_UNCONFIGURED"


      - name: Report invalid Oracle source without deployment
        if: steps.validation.outcome != 'success'
        run: |
          echo "::warning::Oracle source failed syntax validation; deployment skipped. CI remains the authoritative failure signal."
          echo "ORACLE_DEPLOY_SKIPPED_INVALID_SOURCE"
